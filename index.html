<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>સ્ટાર્ટર મોટર 3D લેબ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Mukta+Vaani:wght@600;800&family=Mukta:wght@700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: workshop bay — one dark 3D viewport on top shared by every tab, job-card panel below it */
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#18222d; --muted:#5b6876; --line:#d3dbe3;
  --accent:#1565c0; --accent-ink:#ffffff; --hl:#f2a900; --good:#2e7d4f; --bad:#c0392b; --soft:#e6eef8;
  --bay:#1b2430; --bay-ink:#e3e9ef; --bay-btn:rgba(255,255,255,.1); --bay-line:rgba(255,255,255,.18);
  --meter:#0f1d27; --meter-fg:#7dffb0; --meter-dim:#5f8a74;
  --f-disp:"Mukta Vaani","Mukta","Hind Vadodara","Hind","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Hind Vadodara","Hind","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e3e9ef; --muted:#9aa8b6; --line:#2a3642;
  --accent:#5aa2f0; --accent-ink:#06121f; --hl:#ffc233; --good:#5cc98a; --bad:#ff7a6b; --soft:#1c2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e3e9ef; --muted:#9aa8b6; --line:#2a3642;
  --accent:#5aa2f0; --accent-ink:#06121f; --hl:#ffc233; --good:#5cc98a; --bad:#ff7a6b; --soft:#1c2a3a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.55rem,4.5vw,2.2rem);line-height:1.15;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
h2{font-family:var(--f-disp);font-weight:800;font-size:1.22rem;margin:0;line-height:1.3;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;font:600 .98rem var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.viewer{position:relative;height:clamp(330px,60vh,580px);border-radius:14px;overflow:hidden;background:var(--bay);touch-action:none}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.vbtns{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.vbtns button{pointer-events:auto;font:600 .85rem var(--f-body);color:var(--bay-ink);background:var(--bay-btn);border:1px solid var(--bay-line);border-radius:8px;padding:5px 10px;cursor:pointer;backdrop-filter:blur(4px)}
.vbtns button[aria-pressed="true"]{background:var(--hl);color:#1b1b1b;border-color:var(--hl)}
.vhelp{position:absolute;left:12px;bottom:10px;right:12px;color:#9fb0c2;font-size:.78rem;pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-130%);background:var(--hl);color:#1b1b1b;font-weight:700;font-size:.9rem;padding:3px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--hl)}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--bay-ink);text-align:center;padding:20px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 .95rem var(--f-body);border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
.muted{color:var(--muted)}
.note{border-left:4px solid var(--hl);background:var(--soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.pinfo{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.bignum{font-family:var(--f-mono);font-size:2rem;line-height:1;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;min-width:3.2rem;text-align:center}
.pname{font-family:var(--f-disp);font-weight:800;font-size:1.35rem;line-height:1.25}
.pen{color:var(--muted);font-size:.95rem}
.chips{display:grid;gap:10px}
.chipgrp{display:grid;gap:6px}
.chipgrp h3{font-size:.85rem;color:var(--muted);letter-spacing:.03em}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .88rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer}
.chip b{font-family:var(--f-mono);font-weight:400;color:var(--accent);margin-right:4px}
.chip[aria-pressed="true"]{border-color:var(--hl);box-shadow:0 0 0 2px var(--hl) inset}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gauge{background:var(--meter);color:var(--meter-fg);border-radius:10px;padding:8px 12px;display:grid;gap:2px;min-width:0}
.gauge span{font-size:.75rem;color:var(--meter-dim)}
.gauge b{font-family:var(--f-mono);font-weight:400;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 .85rem var(--f-mono);cursor:pointer}
.dot[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.tgrid{grid-template-columns:270px 1fr}}
.tlist{display:grid;gap:6px;align-content:start}
.tlist button{text-align:left;font:500 .93rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tlist button b{font-family:var(--f-mono);font-weight:400;color:var(--muted)}
.tlist button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.tlist button.done::after{content:"✓";margin-left:auto;color:var(--good);font-weight:700}
.meter{background:var(--meter);color:var(--meter-fg);border-radius:12px;padding:12px 16px;display:grid;gap:4px}
.meter .cap{font-size:.8rem;color:var(--meter-dim)}
.meter .val{font-family:var(--f-mono);font-size:clamp(1.5rem,6vw,2.3rem);line-height:1.15;overflow-wrap:anywhere}
.fb{border-radius:8px;padding:8px 12px;font-weight:500}
.fb.ok{background:color-mix(in srgb,var(--good) 16%,var(--panel));border:1px solid var(--good)}
.fb.no{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border:1px solid var(--bad)}
ol.tsteps{margin:0;padding-left:1.3em;display:grid;gap:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.score{font-family:var(--f-mono);font-size:1.1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:500 1rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding-top:6px}
.startbtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:30px;width:96px;height:96px;border-radius:50%;border:4px solid #cfd5db;background:radial-gradient(circle at 35% 30%,#ff6b5e,#c62828 55%,#7f0000);color:#fff;display:grid;place-content:center;gap:0;font:800 1.15rem var(--f-mono);line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -4px 8px rgba(0,0,0,.35);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s}
.startbtn small{font:600 .68rem var(--f-body)}
.startbtn.on{transform:scale(.92);box-shadow:0 0 0 6px rgba(255,140,0,.35),0 0 28px #ff8f00,inset 0 4px 10px rgba(0,0,0,.4)}
.vhelp{right:120px}
.gauges.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.gauges.g4{grid-template-columns:repeat(2,1fr)}}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.phases li{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);display:flex;gap:6px}
.phases li b{font-family:var(--f-mono);font-weight:400}
.phases li.on{background:var(--hl);color:#1b1b1b;border-color:var(--hl);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.hdr{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.hgrp{display:grid;gap:2px;min-width:0;flex:1 1 320px}
.langs{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.langs button{font:700 .95rem var(--f-body);min-width:44px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#voiceBtn[aria-pressed="true"]{background:var(--hl);color:#1b1b1b;border-color:var(--hl)}
.vnote{margin:0;font-size:.85rem;color:var(--bad)}
.scope{background:var(--meter);border-radius:12px;padding:8px 10px;display:grid;gap:4px}
.scope .scap{font-size:.8rem;color:var(--meter-dim)}
.scope canvas{display:block;width:100%;height:150px}
.tlist button.miss::after{content:"✗";margin-left:auto;color:var(--bad);font-weight:700}
.tblwrap{overflow-x:auto}
table.rep{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
table.rep th,table.rep td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.rep th{background:var(--soft);font-weight:700}
table.rep tr.ok td:nth-child(4){color:var(--good);font-weight:600}
table.rep tr.no td:nth-child(4){color:var(--bad);font-weight:600}
.eqs{display:grid;gap:6px}
.eqs code{font-family:var(--f-mono);font-size:1.05rem;background:var(--meter);color:var(--meter-fg);padding:8px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.note.warn{border-left-color:var(--bad)}
.svgwrap{overflow-x:auto}
svg.circ,svg.chart{display:block;width:100%;min-width:520px;height:auto}
svg.circ .bx{fill:var(--soft);stroke:var(--ink);stroke-width:1.5}
svg.circ .arm{fill:none;stroke:var(--ink);stroke-width:2}
svg.circ .zig{fill:none;stroke:#c77b43;stroke-width:3}
svg.circ .wireM,svg.circ .wireM path{fill:none;stroke:#c62828;stroke-width:5;stroke-linejoin:round}
svg.circ .wireC,svg.circ .wireC path{fill:none;stroke:#e08a1e;stroke-width:2.5;stroke-linejoin:round}
svg.circ .gnd{fill:none;stroke:var(--ink);stroke-width:2}
svg.circ text{fill:var(--ink)}
svg.circ .tt{font:700 14px var(--f-body)}svg.circ .ts{font:500 12px var(--f-body)}svg.circ .tm{font:400 12px var(--f-mono)}
svg.chart .gl{stroke:var(--line);stroke-width:1}svg.chart .ax{stroke:var(--muted);stroke-width:1.5}
svg.chart .tk{fill:var(--muted);font:400 11px var(--f-mono)}svg.chart .lb{font:700 13px var(--f-body)}
svg.chart .c1{fill:none;stroke:var(--accent);stroke-width:3}svg.chart .c1t{fill:var(--accent)}
svg.chart .c2{fill:none;stroke:#d9480f;stroke-width:3}svg.chart .c2t{fill:#d9480f}
svg.chart .c3{fill:none;stroke:var(--good);stroke-width:3;stroke-dasharray:7 5}svg.chart .c3t{fill:var(--good)}
svg.plan .pr{fill:#4a3f36;stroke:var(--ink);stroke-width:1.5}svg.plan .prin{fill:var(--panel);stroke:none}svg.plan .pt{stroke:#4a3f36;stroke-width:3}
svg.plan .pp{fill:#b8c0c8;stroke:var(--ink);stroke-width:1.5}svg.plan .ps{fill:#d8b04c;stroke:var(--ink);stroke-width:1.5}svg.plan .pin{fill:var(--ink)}
svg.plan .pc{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 4}
svg.plan text{font:600 14px var(--f-body)}svg.plan .t2{fill:#7c8691}svg.plan .t3{fill:#a07d22}svg.plan .t4{fill:var(--accent)}svg.plan .tm{font:400 13px var(--f-mono)}
.plist{margin:0;padding-left:1.2em;display:grid;gap:4px}
</style>
<div class="wrap">
  <header class="hdr">
    <div class="hgrp"><h1 data-t="h1">સ્ટાર્ટર મોટર 3D લેબ</h1><p class="sub" data-t="sub"></p></div>
    <div class="langs" role="group" aria-label="Language / ભાષા / भाषा">
      <button data-lang="gu" aria-pressed="true" lang="gu">ગુજ</button>
      <button data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
      <button data-lang="en" aria-pressed="false" lang="en">EN</button>
      <button id="voiceBtn" aria-pressed="false" data-ta="voice">🔊</button>
    </div>
  </header>
  <p class="vnote" id="vnote" hidden></p>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-work" aria-controls="v-work" aria-selected="true" data-t="tabWork"></button>
    <button role="tab" id="t-parts" aria-controls="v-parts" aria-selected="false" data-t="tabParts"></button>
    <button role="tab" id="t-dis" aria-controls="v-dis" aria-selected="false" data-t="tabDis"></button>
    <button role="tab" id="t-insp" aria-controls="v-insp" aria-selected="false" data-t="tabInsp"></button>
    <button role="tab" id="t-test" aria-controls="v-test" aria-selected="false" data-t="tabTest"></button>
    <button role="tab" id="t-theory" aria-controls="v-theory" aria-selected="false" data-t="tabTheory"></button>
    <button role="tab" id="t-quiz" aria-controls="v-quiz" aria-selected="false" data-t="tabQuiz"></button>
  </nav>

  <div class="viewer" id="viewer">
    <canvas id="cv" aria-label="3D starter motor"></canvas>
    <div class="vbtns">
      <button id="bCur" aria-pressed="true" hidden data-t="bCur"></button>
      <button id="bMag" aria-pressed="true" hidden data-t="bMag"></button>
      <button id="bPlan" aria-pressed="false" data-t="bPlan"></button>
      <button id="bCut" aria-pressed="true" data-t="bCut"></button>
      <button id="bXray" aria-pressed="false" data-t="bXray"></button>
      <button id="bSpin" aria-pressed="false" data-t="bSpin"></button>
      <button id="bHome" data-t="bHome"></button>
    </div>
    <div class="tag" id="tag" hidden></div>
    <button class="startbtn" id="startBtn" hidden data-ta="startAria"><span>START</span><small data-t="hold"></small></button>
    <div class="vhelp" data-t="vhelp"></div>
    <div class="vmsg" id="vmsg" hidden data-t="vmsg"></div>
  </div>

  <section id="v-work" role="tabpanel" aria-labelledby="t-work" style="display:grid;gap:12px">
    <div class="gauges g4">
      <div class="gauge"><span data-t="gKey"></span><b id="gKey">OFF</b></div>
      <div class="gauge"><span data-t="gAmp"></span><b id="gAmp">0 A</b></div>
      <div class="gauge"><span data-t="gArm"></span><b id="gArm">0 rpm</b></div>
      <div class="gauge"><span data-t="gEng"></span><b id="gEng"></b></div>
    </div>
    <div class="scope"><div class="scap" data-t="scope"></div><canvas id="scope"></canvas></div>
    <div class="panel">
      <div class="row">
        <button class="btn" id="wFuel" aria-pressed="true"></button>
        <button class="btn" id="wSlow" aria-pressed="false"></button>
        <button class="btn" id="wSnd" aria-pressed="true"></button>
        <button class="btn" id="wVib" aria-pressed="true"></button>
        <button class="btn" id="wStop"></button>
      </div>
      <ol class="phases" id="phases"></ol>
      <h2 id="phTitle"></h2>
      <p id="phText"></p>
      <div class="note" id="phNote"></div>
      <div class="note" id="planInfo" hidden data-t="planInfo"></div>
      <div class="legend">
        <span><i style="background:#ffc400"></i><span data-t="lgMain"></span></span>
        <span><i style="background:#4dd0e1"></i><span data-t="lgPull"></span></span>
        <span><i style="background:#c792ff"></i><span data-t="lgHold"></span></span>
        <span><i style="background:#58c4ff;height:3px"></i><span data-t="lgField"></span></span>
        <span><i style="background:#c62828"></i><span data-t="lgN"></span></span><span><i style="background:#1e5ac8"></i><span data-t="lgS"></span></span>
      </div>
    </div>
  </section>

  <section id="v-parts" role="tabpanel" aria-labelledby="t-parts" hidden style="display:grid;gap:12px">
    <div class="panel">
      <div class="pinfo">
        <div class="bignum" id="pNum">—</div>
        <div style="display:grid;gap:4px;min-width:0">
          <div class="pname" id="pName"></div>
          <div class="pen" id="pEn"></div>
          <div><span class="pill" id="pGrp"></span></div>
          <p id="pDesc"></p>
        </div>
      </div>
      <div class="row">
        <button class="btn" id="pPrev" data-t="pPrev"></button>
        <button class="btn" id="pNext" data-t="pNext"></button>
        <button class="btn" id="pAll" data-t="pClear"></button>
      </div>
    </div>
    <div class="panel">
      <h2 data-t="pList"></h2>
      <div class="chips" id="chips"></div>
      <div class="note" data-t="pNote"></div>
    </div>
  </section>

  <section id="v-dis" role="tabpanel" aria-labelledby="t-dis" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="steps" id="dDots"></div>
        <div class="row">
          <button class="btn" id="dPrev" data-t="dPrev"></button>
          <button class="btn pri" id="dNext" data-t="dNext"></button>
          <button class="btn" id="dReset" data-t="dReset"></button>
        </div>
      </div>
      <h2 id="dTitle"></h2>
      <p id="dText"></p>
      <div class="note" id="dNote"></div>
    </div>
  </section>

  <section id="v-insp" role="tabpanel" aria-labelledby="t-insp" hidden style="display:grid;gap:12px">
    <div class="tgrid">
      <div class="panel" style="align-content:start">
        <div class="row" style="justify-content:space-between"><h2 data-t="iHead"></h2><span class="score" id="iScore">0 / 0</span></div>
        <div class="tlist" id="iList"></div>
        <button class="btn" id="iNewJob" data-t="iNew"></button>
      </div>
      <div class="panel" style="align-content:start">
        <div class="row" style="justify-content:space-between"><h2 id="iName"></h2><span class="pill" id="iJob"></span></div>

/* ================= PARTS ================= */
const PD=[
["pinion","drive","પિનિયન ગિયર","पिनियन गियर","Pinion gear","ફ્લાયવ્હીલના રિંગ ગિયર સાથે જોડાઈને એન્જિન ફેરવે. દાંતા ઘસાય કે તૂટે તો ખટખટ અવાજ આવે અને સ્ટાર્ટર ફરે પણ એન્જિન ન ફરે.","फ्लाईव्हील के रिंग गियर से जुड़कर इंजन घुमाता है। दाँते घिसे या टूटे हों तो खटखट आवाज़ आती है और स्टार्टर घूमता है पर इंजन नहीं घूमता।","Meshes with the flywheel ring gear and turns the engine. Worn or broken teeth cause clashing; the starter spins but the engine does not turn."],
["clutch","drive","ઓવરરનિંગ ક્લચ","ओवररनिंग क्लच","Overrunning (roller) clutch","ફક્ત એક જ દિશામાં ટોર્ક આપે. એન્જિન ચાલુ થયા પછી રિંગ ગિયર પિનિયનને ખૂબ ઝડપે ફેરવે, ત્યારે ક્લચ છૂટો પડી આર્મેચરને વધુ ઝડપથી બચાવે.","केवल एक दिशा में टॉर्क देता है। इंजन चालू होने पर रिंग गियर पिनियन को बहुत तेज़ घुमाता है, तब क्लच छूटकर आर्मेचर को ज़्यादा स्पीड से बचाता है।","Transmits torque in one direction only. When the engine starts and drives the pinion faster, the clutch freewheels and protects the armature from over-speed."],
["rollers","drive","ક્લચ રોલર","क्लच रोलर","Clutch rollers","ક્લચની અંદરના રોલર ઢાળવાળા ખાંચામાં ભરાઈને લોક કરે અને ઊલટી દિશામાં છૂટા પડે. નાની સ્પ્રિંગ તેમને ખાંચા તરફ ધકેલી રાખે.","क्लच के अंदर के रोलर ढलान वाले खाँचे में फँसकर लॉक करते हैं और उल्टी दिशा में छूट जाते हैं। छोटी स्प्रिंग उन्हें खाँचे की ओर दबाए रखती है।","Rollers wedge into tapered ramps to lock and roll free in the opposite direction. Small springs keep them pressed toward the ramps."],
["mspring","drive","મેશિંગ સ્પ્રિંગ","मेशिंग स्प्रिंग","Meshing (drive) spring","પિનિયનનો દાંત રિંગ ગિયરના દાંત સામે અટકે (દાંત પર દાંત) ત્યારે આ સ્પ્રિંગ દબાય. આર્મેચર સહેજ ફરતાં જ તે પિનિયનને અંદર ધકેલી દે.","पिनियन का दाँत रिंग गियर के दाँत पर अटक जाए (दाँत पर दाँत) तो यह स्प्रिंग दबती है। आर्मेचर थोड़ा घूमते ही पिनियन अंदर चला जाता है।","Compresses when a pinion tooth butts against a ring-gear tooth; as soon as the armature turns slightly it pushes the pinion into mesh."],
["sleeve","drive","હેલિકલ સ્પ્લાઇન સ્લીવ અને કોલર","हेलिकल स्प्लाइन स्लीव और कॉलर","Helical spline sleeve & drive collar","શાફ્ટની વાંકી (હેલિકલ) સ્પ્લાઇન પર સરકે, એટલે પિનિયન આગળ જતાં સહેજ ફરે અને સરળતાથી જોડાય. બે કોલર વચ્ચેના ખાંચામાં ડ્રાઇવ લીવર બેસે.","शाफ्ट की टेढ़ी (हेलिकल) स्प्लाइन पर सरकती है, जिससे पिनियन आगे जाते समय थोड़ा घूमकर आसानी से जुड़ता है। दो कॉलर के बीच की खाँच में ड्राइव लीवर बैठता है।","Slides on the shaft's helical splines so the pinion rotates slightly as it moves forward and meshes smoothly. The drive lever sits between the two collars."],
["fork","drive","શિફ્ટ ફોર્ક / ડ્રાઇવ લીવર","शिफ्ट फोर्क / ड्राइव लीवर","Shift fork / drive lever","સોલેનોઇડનો પ્લન્જર અંદર ખેંચાય ત્યારે લીવર પિવોટ પર ફરે અને નીચેથી પિનિયનને રિંગ ગિયર તરફ ધકેલે.","सोलेनॉइड का प्लंजर अंदर खिंचता है तो लीवर पिवट पर घूमकर नीचे से पिनियन को रिंग गियर की ओर धकेलता है।","When the solenoid plunger is pulled in, the lever pivots and pushes the pinion toward the ring gear."],
["pivot","drive","પિવોટ પિન","पिवट पिन","Pivot pin","ડ્રાઇવ લીવરનો ટેકો. ઘસાય કે ઢીલી હોય તો પિનિયન પૂરું આગળ ન જાય.","ड्राइव लीवर का आधार। घिस जाए या ढीला हो तो पिनियन पूरा आगे नहीं जाता।","Fulcrum of the drive lever. If worn or loose, the pinion does not travel fully forward."],
["stopring","drive","સ્ટોપ રિંગ અને સર્કલિપ","स्टॉप रिंग और सर्किलप","Stop ring & circlip","પિનિયનને શાફ્ટના છેડાથી આગળ જતાં અટકાવે. ખોલતી વખતે પહેલાં સ્ટોપ રિંગ પાછળ ખસેડો, પછી સર્કલિપ કાઢો.","पिनियन को शाफ्ट के सिरे से आगे जाने से रोकती है। खोलते समय पहले स्टॉप रिंग पीछे सरकाएँ, फिर सर्किलप निकालें।","Stops the pinion at the end of the shaft. To remove, push the stop ring back first, then take out the circlip."],
["debush","frame","ડ્રાઇવ એન્ડ બુશ","ड्राइव एंड बुश","Drive end bush","શાફ્ટના આગળના છેડાને ટેકો આપે. ઘસાય તો આર્મેચર નીચે નમે અને પોલ શૂ સાથે ઘસાય (આર્મેચર રબિંગ).","शाफ्ट के आगे के सिरे को सहारा देता है। घिस जाए तो आर्मेचर झुककर पोल शू से रगड़ता है (आर्मेचर रबिंग)।","Supports the front of the shaft. When worn, the armature drops and rubs on the pole shoes (armature rubbing)."],
["def","frame","ડ્રાઇવ એન્ડ ફ્રેમ","ड्राइव एंड हाउसिंग","Drive end housing","એલ્યુમિનિયમનું હાઉસિંગ. આના કાનના બોલ્ટથી સ્ટાર્ટર એન્જિન કે ગિયરબોક્સ સાથે લાગે. નીચેની ખુલ્લી બારીમાંથી પિનિયન રિંગ ગિયરને મળે.","एल्युमिनियम का हाउसिंग। इसके कान के बोल्ट से स्टार्टर इंजन या गियरबॉक्स पर लगता है। नीचे की खुली खिड़की से पिनियन रिंग गियर से मिलता है।","Aluminium housing. Its mounting flange bolts the starter to the engine or gearbox; the pinion meets the ring gear through the open window."],
["shaft","motor","આર્મેચર શાફ્ટ","आर्मेचर शाफ्ट","Armature shaft","કોર, કોમ્યુટેટર અને ડ્રાઇવ બધું આ શાફ્ટ પર. વાંક (રનઆઉટ) V-બ્લોક અને ડાયલ ગેજથી તપાસાય.","कोर, कम्यूटेटर और ड्राइव सब इसी शाफ्ट पर। टेढ़ापन (रनआउट) V-ब्लॉक और डायल गेज से जाँचा जाता है।","Carries the core, commutator and drive. Bend (run-out) is checked on V-blocks with a dial gauge."],
["core","motor","આર્મેચર કોર","आर्मेचर कोर","Laminated armature core","પાતળી લોખંડની પતરીઓ (લેમિનેશન) જોડીને બનેલો, જેથી એડી કરંટ અને ગરમી ઘટે. ખાંચામાં તાંબાના કંડક્ટર બેસે છે.","पतली लोहे की पत्तियों (लैमिनेशन) से बना, ताकि एडी करंट और गर्मी कम हो। खाँचों में तांबे के कंडक्टर बैठते हैं।","Built from thin laminated steel sheets to cut eddy currents and heat. Copper conductors sit in its slots."],
["winding","motor","આર્મેચર વાઇન્ડિંગ","आर्मेचर वाइंडिंग","Armature conductors","જાડી તાંબાની પટ્ટી. કરંટ વહે ત્યારે ચુંબકીય ક્ષેત્રમાં બળ લાગે અને આર્મેચર ફરે. શોર્ટ ટર્ન ગ્રાઉલર ટેસ્ટથી પકડાય.","मोटी तांबे की पट्टी। करंट बहने पर चुंबकीय क्षेत्र में बल लगता है और आर्मेचर घूमता है। शॉर्ट टर्न ग्राउलर टेस्ट से पकड़ा जाता है।","Heavy copper bars. Current in the magnetic field produces a force that turns the armature. Shorted turns are found with a growler test."],
["comm","motor","કોમ્યુટેટર","कम्यूटेटर","Commutator","તાંબાના સેગમેન્ટનો ગોળ સમૂહ. બ્રશ મારફતે આર્મેચર કોઇલમાં કરંટની દિશા વારાફરતી બદલે, જેથી આર્મેચર એક જ દિશામાં ફરતું રહે.","तांबे के सेगमेंट का गोल समूह। ब्रश के ज़रिए आर्मेचर कॉइल में करंट की दिशा बारी-बारी बदलता है, जिससे आर्मेचर एक ही दिशा में घूमता रहे।","A ring of copper segments. Through the brushes it reverses the current in each armature coil at the right moment, so the armature keeps turning one way."],
["mica","motor","માઇકા ઇન્સ્યુલેશન","माइका इंसुलेशन","Mica insulation","બે સેગમેન્ટ વચ્ચેનું ઇન્સ્યુલેશન. સેગમેન્ટથી સહેજ નીચે (અન્ડરકટ) રહેવું જોઈએ. ઊંચું રહે તો બ્રશ ઉછળે અને તણખા થાય.","दो सेगमेंट के बीच का इंसुलेशन। सेगमेंट से थोड़ा नीचे (अंडरकट) होना चाहिए। ऊँचा हो तो ब्रश उछलते हैं और चिंगारी होती है।","Insulation between segments. It must sit slightly below the copper (undercut); if high, the brushes bounce and spark."],
["brush","motor","કાર્બન બ્રશ","कार्बन ब्रश","Carbon brushes","કોમ્યુટેટર સુધી કરંટ પહોંચાડે. સામાન્ય રીતે 4: 2 ઇન્સ્યુલેટેડ (+) અને 2 ગ્રાઉન્ડ (−). ઘસાય તો કરંટ ઘટે અને સ્ટાર્ટર ધીમું ફરે.","कम्यूटेटर तक करंट पहुँचाते हैं। आम तौर पर 4: 2 इंसुलेटेड (+) और 2 ग्राउंड (−)। घिस जाएँ तो करंट घटता है और स्टार्टर धीमा घूमता है।","Carry current to the commutator. Usually four: two insulated (+) and two earthed (−). Worn brushes reduce current and the starter cranks slowly."],
["bspring","motor","બ્રશ સ્પ્રિંગ","ब्रश स्प्रिंग","Brush springs","બ્રશને કોમ્યુટેટર પર દબાવી રાખે. નબળી સ્પ્રિંગ એટલે ખરાબ સંપર્ક, તણખા અને ધીમું ક્રેન્કિંગ.","ब्रश को कम्यूटेटर पर दबाकर रखती है। कमज़ोर स्प्रिंग यानी खराब संपर्क, चिंगारी और धीमी क्रैंकिंग।","Press the brushes onto the commutator. A weak spring means poor contact, sparking and slow cranking."],
["bholder","motor","બ્રશ હોલ્ડર","ब्रश होल्डर","Brush holders","બ્રશને સીધું અંદર-બહાર સરકવા દે. ઇન્સ્યુલેટેડ હોલ્ડર પ્લેટથી ઇન્સ્યુલેટ હોવું જ જોઈએ.","ब्रश को सीधा अंदर-बाहर सरकने देता है। इंसुलेटेड होल्डर प्लेट से इंसुलेट होना ही चाहिए।","Guide the brushes radially. Insulated holders must be insulated from the plate."],
["bplate","motor","બ્રશ પ્લેટ","ब्रश प्लेट","Brush plate","બધા બ્રશ હોલ્ડરને પકડી રાખતી પ્લેટ. કેટલાક સ્ટાર્ટરમાં તે CE ફ્રેમ સાથે જ હોય.","सभी ब्रश होल्डर को पकड़ने वाली प्लेट। कुछ स्टार्टर में यह CE फ्रेम के साथ ही होती है।","Holds all the brush holders. On some starters it is part of the commutator end frame."],
["yoke","motor","યોક / ફીલ્ડ ફ્રેમ","योक / फील्ड फ्रेम","Yoke / field frame","બહારનું લોખંડનું ખોખું. પોલ શૂ અને ફીલ્ડ કોઇલને પકડે અને ચુંબકીય રસ્તો પૂરો કરે.","बाहर का लोहे का खोल। पोल शू और फील्ड कॉइल को पकड़ता है और चुंबकीय रास्ता पूरा करता है।","Outer steel shell. Holds the pole shoes and field coils and completes the magnetic circuit."],
["pole","motor","પોલ શૂ","पोल शू","Pole shoes","યોકની અંદર સ્ક્રૂથી લાગે અને ફીલ્ડનું ચુંબકીય ક્ષેત્ર આર્મેચર તરફ કેન્દ્રિત કરે. અહીં 4 પોલ શૂ છે.","योक के अंदर स्क्रू से लगे होते हैं और फील्ड का चुंबकीय क्षेत्र आर्मेचर की ओर केंद्रित करते हैं। यहाँ 4 पोल शू हैं।","Screwed inside the yoke; they concentrate the field flux onto the armature. This starter has four."],
["field","motor","ફીલ્ડ કોઇલ","फील्ड कॉइल","Field coils","જાડી તાંબાની પટ્ટીની કોઇલ, આર્મેચર સાથે શ્રેણીમાં (DC સિરીઝ મોટર), એટલે શરૂઆતમાં ખૂબ મોટો ટોર્ક મળે.","मोटी तांबे की पट्टी की कॉइल, आर्मेचर के साथ श्रेणी में (DC सीरीज़ मोटर), इसलिए शुरुआत में बहुत ज़्यादा टॉर्क मिलता है।","Heavy copper-strip coils in series with the armature (DC series motor), giving very high starting torque."],
["fterm","motor","ફીલ્ડ ટર્મિનલ અને ગ્રોમેટ","फील्ड टर्मिनल और ग्रोमेट","Field terminal & grommet","યોકમાંથી ફીલ્ડ કોઇલનો છેડો બહાર લાવે. રબર ગ્રોમેટ તેને યોકથી ઇન્સ્યુલેટ રાખે.","योक से फील्ड कॉइल का सिरा बाहर लाता है। रबर ग्रोमेट उसे योक से इंसुलेट रखता है।","Brings the field-coil lead out of the yoke; a rubber grommet insulates it."],
["cef","frame","કોમ્યુટેટર એન્ડ ફ્રેમ","कम्यूटेटर एंड फ्रेम","Commutator end frame","પાછળનું ઢાંકણ. શાફ્ટનો પાછળનો બુશ અહીં હોય, અને ઘણીવાર બ્રશ પ્લેટ પણ.","पीछे का ढक्कन। शाफ्ट का पिछला बुश यहाँ होता है, और अक्सर ब्रश प्लेट भी।","Rear cover. Carries the rear shaft bush and often the brush plate."],
["cebush","frame","CE બુશ","CE बुश","Commutator end bush","શાફ્ટનો પાછળનો છેડો ટેકે. સૂકો કે ઘસાયેલો હોય તો સ્ટાર્ટર ભારે ફરે અને વધુ કરંટ ખેંચે.","शाफ्ट का पिछला सिरा सँभालता है। सूखा या घिसा हो तो स्टार्टर भारी घूमता है और ज़्यादा करंट लेता है।","Supports the rear of the shaft. A dry or worn bush makes the starter drag and draw more current."],
["shim","frame","થ્રસ્ટ વોશર / શિમ","थ्रस्ट वॉशर / शिम","Thrust washer / shim","આર્મેચરની આગળ-પાછળની રમત (એન્ડ પ્લે) યોગ્ય રાખે.","आर्मेचर का आगे-पीछे खेल (एंड प्ले) सही रखता है।","Sets the armature end play."],
["bolt","frame","થ્રૂ બોલ્ટ","थ्रू बोल्ट","Through bolts","બંને એન્ડ ફ્રેમને યોક સાથે જકડે. ખોલતાં પહેલાં ફ્રેમ અને યોક પર નિશાની કરો, જેથી પાછા એ જ સ્થિતિમાં જોડાય.","दोनों एंड फ्रेम को योक से कसते हैं। खोलने से पहले फ्रेम और योक पर निशान लगाएँ ताकि वापस उसी स्थिति में जुड़ें।","Clamp both end frames to the yoke. Mark the frames and yoke before dismantling so they go back in the same position."],
["solhouse","sol","સોલેનોઇડ હાઉસિંગ","सोलेनॉइड हाउसिंग","Solenoid body","મેગ્નેટિક સ્વિચનું ખોખું. અંદર બે વાઇન્ડિંગ, પ્લન્જર, રિટર્ન સ્પ્રિંગ અને લોખંડનો કોર.","मैग्नेटिक स्विच का खोल। अंदर दो वाइंडिंग, प्लंजर, रिटर्न स्प्रिंग और लोहे का कोर।","Body of the magnetic switch. Contains two windings, the plunger, return spring and iron core."],
["pullin","sol","પુલ-ઇન વાઇન્ડિંગ","पुल-इन वाइंडिंग","Pull-in winding","બહારની જાડા તારની વાઇન્ડિંગ. S થી M ટર્મિનલ સુધી, એટલે મોટર મારફતે ગ્રાઉન્ડ. પ્લન્જરને જોરથી ખેંચે. કોન્ટેક્ટ બંધ થતાં બંને છેડે સરખો વોલ્ટેજ આવે એટલે બંધ પડે.","बाहर की मोटे तार की वाइंडिंग। S से M टर्मिनल तक, यानी मोटर से होकर ग्राउंड। प्लंजर को ज़ोर से खींचती है। कॉन्टैक्ट बंद होते ही दोनों सिरों पर बराबर वोल्टेज आने से बंद हो जाती है।","Outer heavy-gauge winding from S to M, earthed through the motor. Gives the strong initial pull; once the contacts close both its ends are at 12 V, so it carries no current."],
["holdin","sol","હોલ્ડ-ઇન વાઇન્ડિંગ","होल्ड-इन वाइंडिंग","Hold-in winding","અંદરની પાતળા તારની વાઇન્ડિંગ, S થી સીધું બોડી ગ્રાઉન્ડ. ખેંચાયેલા પ્લન્જરને પકડી રાખે. ઓછો કરંટ, એટલે ઓછી ગરમી.","अंदर की पतले तार की वाइंडिंग, S से सीधा बॉडी ग्राउंड। खिंचे हुए प्लंजर को पकड़े रखती है। कम करंट, इसलिए कम गर्मी।","Inner fine-gauge winding from S straight to body earth. Holds the plunger in with low current and little heat."],
["plunger","sol","પ્લન્જર","प्लंजर","Plunger","વાઇન્ડિંગના ચુંબકથી અંદર ખેંચાય. એક છેડે ડ્રાઇવ લીવર ખેંચે, બીજા છેડે કોન્ટેક્ટ પ્લેટને ટર્મિનલ સુધી ધકેલે.","वाइंडिंग के चुंबक से अंदर खिंचता है। एक सिरा ड्राइव लीवर खींचता है, दूसरा सिरा कॉन्टैक्ट प्लेट को टर्मिनल तक धकेलता है।","Pulled in by the winding's magnetism. One end moves the drive lever, the other pushes the contact disc onto the terminals."],
["rspring","sol","રિટર્ન સ્પ્રિંગ","रिटर्न स्प्रिंग","Return spring","ચાવી છોડતાં પ્લન્જરને પાછો ધકેલે. પહેલાં કોન્ટેક્ટ ખૂલે, પછી પિનિયન પાછું ખેંચાય.","चाबी छोड़ते ही प्लंजर को वापस धकेलती है। पहले कॉन्टैक्ट खुलता है, फिर पिनियन पीछे आता है।","Pushes the plunger back when the key is released: the contacts open first, then the pinion withdraws."],
["contact","sol","કોન્ટેક્ટ પ્લેટ","कॉन्टैक्ट प्लेट","Contact disc","B (30) અને M ટર્મિનલને જોડીને મોટો કરંટ મોટર સુધી પહોંચાડે. બળી જાય તો \"ટક\" અવાજ આવે પણ મોટર ન ફરે.","B (30) और M टर्मिनल को जोड़कर बड़ा करंट मोटर तक पहुँचाती है। जल जाए तो \"टक\" आवाज़ आती है पर मोटर नहीं घूमती।","Bridges terminals B (30) and M to pass the heavy current to the motor. If burnt, you hear a click but the motor does not turn."],
["termB","sol","B / 30 ટર્મિનલ","B / 30 टर्मिनल","Battery terminal (30)","બેટરીનો જાડો + કેબલ અહીં લાગે. અહીં કાયમ બેટરી વોલ્ટેજ હોય.","बैटरी की मोटी + केबल यहाँ लगती है। यहाँ हमेशा बैटरी वोल्टेज रहता है।","The heavy battery positive cable connects here. Battery voltage is always present."],
["termM","sol","M ટર્મિનલ","M टर्मिनल","Motor terminal","કોન્ટેક્ટ બંધ થાય ત્યારે અહીંથી કરંટ ફીલ્ડ સ્ટ્રેપ મારફતે મોટરમાં જાય.","कॉन्टैक्ट बंद होने पर यहाँ से करंट फील्ड स्ट्रैप द्वारा मोटर में जाता है।","When the contacts close, current leaves here through the field strap to the motor."],
["termS","sol","S / 50 ટર્મિનલ","S / 50 टर्मिनल","Switch terminal (50)","ચાવી START પર હોય ત્યારે જ અહીં 12 V આવે. ઘણી ગાડીઓમાં સ્ટાર્ટર રિલે મારફતે.","चाबी START पर हो तभी यहाँ 12 V आता है। कई गाड़ियों में स्टार्टर रिले के ज़रिए।","Receives 12 V only while the key is at START, often through a starter relay."],
["cap","sol","સોલેનોઇડ કેપ","सोलेनॉइड कैप","Solenoid cap","કોન્ટેક્ટ પ્લેટ અને ટર્મિનલ બોલ્ટને પકડતું ઇન્સ્યુલેટેડ ઢાંકણ.","कॉन्टैक्ट प्लेट और टर्मिनल बोल्ट को पकड़ने वाला इंसुलेटेड ढक्कन।","Insulated cover that carries the contact disc and terminal studs."],
["sun","plan","સન ગિયર","सन गियर","Sun gear","આર્મેચર શાફ્ટના છેડે કાપેલું નાનું ગિયર. આર્મેચર સાથે ખૂબ ઝડપથી ફરે અને ત્રણેય પ્લેનેટ ગિયરને ફેરવે.","आर्मेचर शाफ्ट के सिरे पर कटा छोटा गियर। आर्मेचर के साथ बहुत तेज़ घूमता है और तीनों प्लैनेट गियर को घुमाता है।","Small gear cut on the end of the armature shaft. It spins at armature speed and drives the three planet gears."],
["planet","plan","પ્લેનેટ ગિયર (3)","प्लैनेट गियर (3)","Planet gears (3)","સન ગિયર ફરતે ગોઠવાયેલાં ત્રણ નાનાં ગિયર. પોતાની પિન પર ફરે અને સાથે સન ફરતે ચક્કર પણ મારે; રિંગ ગિયરના અંદરના દાંતામાં ચાલે.","सन गियर के चारों ओर लगे तीन छोटे गियर। अपनी पिन पर घूमते हैं और साथ ही सन के चारों ओर चक्कर लगाते हैं; रिंग गियर के अंदर के दाँतों में चलते हैं।","Three small gears around the sun. Each spins on its own pin while orbiting the sun, rolling inside the ring gear's internal teeth."],
["ringgear","plan","રિંગ ગિયર (ઇન્ટરનલ ગિયર)","रिंग गियर (इंटरनल गियर)","Ring (internal) gear","અંદરની બાજુ દાંતાવાળું મોટું રિંગ. હાઉસિંગ સાથે સ્થિર રહે છે. ઘણા સ્ટાર્ટરમાં તે પ્લાસ્ટિક કે રેઝિનનું હોય છે, જેથી અવાજ અને આંચકો ઘટે.","अंदर की ओर दाँतों वाली बड़ी रिंग। हाउसिंग के साथ स्थिर रहती है। कई स्टार्टर में यह प्लास्टिक या रेज़िन की होती है, ताकि आवाज़ और झटका कम हो।","Large ring with internal teeth, held stationary in the housing. On many starters it is moulded plastic or resin to cut noise and shock."],
["carrier","plan","પ્લેનેટ કેરિયર અને આઉટપુટ શાફ્ટ","प्लैनेट कैरियर और आउटपुट शाफ्ट","Planet carrier & output shaft","ત્રણેય પ્લેનેટ ગિયરની પિન પકડે છે. પ્લેનેટ સન ફરતે ફરે તેમ કેરિયર ધીમું પણ મોટા ટોર્કથી ફરે, અને આઉટપુટ શાફ્ટ મારફતે ક્લચ અને પિનિયનને ફેરવે.","तीनों प्लैनेट गियर की पिन पकड़ता है। प्लैनेट सन के चारों ओर घूमते हैं तो कैरियर धीमा पर बड़े टॉर्क से घूमता है और आउटपुट शाफ्ट से क्लच और पिनियन को घुमाता है।","Holds the pins of the three planets. As the planets orbit, the carrier turns slowly with high torque and drives the clutch and pinion through the output shaft."],
["strap","motor","ફીલ્ડ સ્ટ્રેપ","फील्ड स्ट्रैप","Field connector strap","M ટર્મિનલથી ફીલ્ડ ટર્મિનલ સુધીની તાંબાની પટ્ટી. સ્ટાર્ટર ખોલવાનું પહેલું કામ આ નટ ખોલવાનું.","M टर्मिनल से फील्ड टर्मिनल तक तांबे की पट्टी। स्टार्टर खोलने का पहला काम यही नट खोलना है।","Copper strap from terminal M to the field terminal. Removing this nut is the first step of dismantling."]
];

const BY=Object.fromEntries(PARTS.map(p=>[p.id,p]));
const GRP={drive:["ડ્રાઇવ મિકેનિઝમ","ड्राइव मैकेनिज़्म","Drive mechanism"],motor:["મોટર ભાગ","मोटर भाग","Motor"],sol:["સોલેનોઇડ (મેગ્નેટિક સ્વિચ)","सोलेनॉइड (मैग्नेटिक स्विच)","Solenoid (magnetic switch)"],frame:["ફ્રેમ, બુશ અને બોલ્ટ","फ्रेम, बुश और बोल्ट","Frames, bushes & bolts"],plan:["પ્લેનેટરી ગિયર સેટ (PLGR)","प्लैनेटरी गियर सेट (PLGR)","Planetary gear set (PLGR)"]};

/* ================= WORKING PHASES ================= */
const PH=[
 {t:["તૈયાર (OFF)","तैयार (OFF)","Ready (OFF)"],
  x:["મોડલની નીચે જમણી બાજુનું લાલ START બટન દબાવી રાખો. B (30) ટર્મિનલ પર બેટરીનો લાલ કેબલ કાયમ 12 V સાથે તૈયાર છે, પણ કોન્ટેક્ટ ખુલ્લો છે એટલે મોટરમાં કરંટ નથી.","मॉडल के नीचे दाईं ओर का लाल START बटन दबाए रखें। B (30) टर्मिनल पर बैटरी की लाल केबल हमेशा 12 V के साथ तैयार है, पर कॉन्टैक्ट खुला है इसलिए मोटर में करंट नहीं है।","Press and hold the red START button at the bottom right of the model. The red battery cable keeps 12 V on terminal B (30), but the contacts are open, so no current flows in the motor."],
  n:["🐢 સ્લો મોશન ચાલુ કરશો તો દરેક ક્રિયા 4 ગણી ધીમી દેખાશે. કમ્પ્યુટરમાં Space કી પણ START તરીકે ચાલે છે.","🐢 स्लो मोशन चालू करेंगे तो हर क्रिया 4 गुना धीमी दिखेगी। कंप्यूटर में Space कुंजी भी START का काम करती है।","🐢 Slow motion makes every action four times slower. On a computer the Space bar also works as START."]},
 {t:["ચુંબક બને છે","चुंबक बनता है","Magnetism builds"],
  x:["S (50) ટર્મિનલે નાનો કરંટ આવ્યો. ભૂરા કણ પુલ-ઇન વાઇન્ડિંગના આંટામાં અને જાંબલી કણ હોલ્ડ-ઇન વાઇન્ડિંગના આંટામાં ફરે છે. તાર ફરતે ગોળ ફરતો કરંટ ચુંબકીય ક્ષેત્ર (આછી વાદળી રેખાઓ) બનાવે છે, અને સોલેનોઇડ N–S ચુંબક બને છે.","S (50) टर्मिनल पर छोटा करंट आया। नीले कण पुल-इन वाइंडिंग के फेरों में और बैंगनी कण होल्ड-इन वाइंडिंग के फेरों में घूमते हैं। तार के चारों ओर घूमता करंट चुंबकीय क्षेत्र (हल्की नीली रेखाएँ) बनाता है और सोलेनॉइड N–S चुंबक बन जाता है।","A small current reaches terminal S (50). Cyan particles circulate through the pull-in turns and violet particles through the hold-in turns. Current flowing around the turns creates a magnetic field (pale blue lines) and the solenoid becomes an N–S magnet."],
  n:["બંને વાઇન્ડિંગનો કરંટ એક જ દિશામાં ફરે છે, એટલે બંનેનું ચુંબક ઉમેરાય અને પ્લન્જર પર સૌથી વધુ ખેંચાણ મળે.","दोनों वाइंडिंग का करंट एक ही दिशा में घूमता है, इसलिए दोनों का चुंबक जुड़ता है और प्लंजर पर सबसे ज़्यादा खिंचाव मिलता है।","Both windings carry current in the same direction, so their magnetism adds and the plunger gets the strongest pull."]},
 {t:["પ્લન્જર ખેંચાય, પિનિયન જોડાય","प्लंजर खिंचता है, पिनियन जुड़ता है","Plunger pulls in, pinion engages"],
  x:["ચુંબક લોખંડના પ્લન્જરને અંદર ખેંચે છે, અને રિટર્ન સ્પ્રિંગ દબાય છે. લીવર પિવોટ પર ફરી પિનિયનને રિંગ ગિયર તરફ ધકેલે છે. પુલ-ઇનનો કરંટ M ટર્મિનલ મારફતે મોટરમાં પણ જાય છે, એટલે આર્મેચર ધીમે ફરે અને દાંત સહેલાઈથી ગોઠવાય.","चुंबक लोहे के प्लंजर को अंदर खींचता है और रिटर्न स्प्रिंग दबती है। लीवर पिवट पर घूमकर पिनियन को रिंग गियर की ओर धकेलता है। पुल-इन का करंट M टर्मिनल से मोटर में भी जाता है, इसलिए आर्मेचर धीरे घूमता है और दाँत आसानी से बैठते हैं।","The magnet pulls the iron plunger in and compresses the return spring. The lever pivots and pushes the pinion toward the ring gear. Pull-in current also flows through M into the motor, so the armature turns slowly and the teeth find their place."],
  n:["દાંત પર દાંત અટકે તો મેશિંગ સ્પ્રિંગ દબાય, અને પ્લન્જર આગળ જઈ શકે.","दाँत पर दाँत अटके तो मेशिंग स्प्रिंग दबती है और प्लंजर आगे जा सकता है।","If tooth meets tooth, the meshing spring compresses and lets the plunger complete its travel."]},
 {t:["કોન્ટેક્ટ બંધ: મોટો કરંટ","कॉन्टैक्ट बंद: बड़ा करंट","Contacts close: heavy current"],
  x:["કોન્ટેક્ટ પ્લેટ B અને M ને જોડે છે, એટલે \"ઠક\" અવાજ આવે. પીળા કણ મોટો કરંટ બતાવે છે: બેટરી → B → કોન્ટેક્ટ → M → ફીલ્ડ સ્ટ્રેપ → ફીલ્ડ કોઇલ → + બ્રશ → કોમ્યુટેટર → આર્મેચર → − બ્રશ → બોડી → બેટરી −. ફીલ્ડ કોઇલ પોલ શૂને N અને S ચુંબક બનાવે છે.","कॉन्टैक्ट प्लेट B और M को जोड़ती है, \"ठक\" आवाज़ आती है। पीले कण बड़ा करंट दिखाते हैं: बैटरी → B → कॉन्टैक्ट → M → फील्ड स्ट्रैप → फील्ड कॉइल → + ब्रश → कम्यूटेटर → आर्मेचर → − ब्रश → बॉडी → बैटरी −। फील्ड कॉइल पोल शू को N और S चुंबक बनाती है।","The contact disc bridges B and M with a clunk. Yellow particles show the heavy current: battery → B → contact → M → field strap → field coils → + brushes → commutator → armature → − brushes → body → battery −. The field coils turn the pole shoes into N and S poles."],
  n:["પુલ-ઇનના બંને છેડે હવે 12 V છે, એટલે તેમાં કરંટ બંધ થયો (ભૂરા કણ અટક્યા). હવે ફક્ત હોલ્ડ-ઇન પ્લન્જરને પકડી રાખે છે.","अब पुल-इन के दोनों सिरों पर 12 V है, इसलिए उसमें करंट बंद हो गया (नीले कण रुक गए)। अब केवल होल्ड-इन प्लंजर को पकड़े रखती है।","Both ends of the pull-in winding are now at 12 V, so its current stops (cyan particles halt). Only the hold-in winding holds the plunger now."]},
 {t:["ક્રેન્કિંગ","क्रैंकिंग","Cranking"],
  x:["ફીલ્ડના ચુંબક અને આર્મેચરના તાંબાના કંડક્ટરમાંના કરંટ વચ્ચે બળ લાગે છે, એટલે આર્મેચર ફરે. કોમ્યુટેટર દરેક ક્ષણે કંડક્ટરમાં કરંટની દિશા બદલે છે, એટલે ફરવાનું એક જ દિશામાં ચાલુ રહે. એન્જિનના કમ્પ્રેશનથી અવાજ \"ઘર્ર-ઘર્ર\" થાય અને કરંટ ઉપર-નીચે થાય.","फील्ड के चुंबक और आर्मेचर के तांबे के कंडक्टर में बहते करंट के बीच बल लगता है, इसलिए आर्मेचर घूमता है। कम्यूटेटर हर पल कंडक्टर में करंट की दिशा बदलता है, जिससे घूमना एक ही दिशा में चलता रहे। इंजन के कम्प्रेशन से आवाज़ \"घर्र-घर्र\" होती है और करंट ऊपर-नीचे होता है।","Force acts between the field magnetism and the current in the armature's copper conductors, so the armature turns. The commutator keeps reversing the current in each conductor so rotation continues one way. Engine compression makes the 'rrr-rrr' sound and the current rises and falls (see the oscilloscope)."],
  n:["સ્ટાર્ટર એક વારમાં 10–15 સેકન્ડથી વધુ ન ચલાવો. ⛽ ફ્યુઅલ બંધ હોય તો એન્જિન ફક્ત ક્રેન્ક થશે.","स्टार्टर एक बार में 10–15 सेकंड से ज़्यादा न चलाएँ। ⛽ फ्यूल बंद हो तो इंजन सिर्फ क्रैंक होगा।","Never crank for more than 10–15 seconds at a time. With ⛽ fuel off the engine only cranks."]},
 {t:["એન્જિન ચાલુ: ઓવરરન","इंजन चालू: ओवररन","Engine runs: overrun"],
  x:["એન્જિન ચાલુ થયું. હવે રિંગ ગિયર પિનિયનને આર્મેચર કરતાં ઘણી ઝડપે ફેરવે છે. ઓવરરનિંગ ક્લચના રોલર છૂટા પડે છે, એટલે એ ઝડપ આર્મેચર સુધી નથી પહોંચતી. તીણો અવાજ ઓવરરનનો છે.","इंजन चालू हो गया। अब रिंग गियर पिनियन को आर्मेचर से बहुत तेज़ घुमाता है। ओवररनिंग क्लच के रोलर छूट जाते हैं, इसलिए वह स्पीड आर्मेचर तक नहीं पहुँचती। तीखी आवाज़ ओवररन की है।","The engine has started. The ring gear now drives the pinion much faster than the armature. The overrunning-clutch rollers free off, so that speed never reaches the armature. The high-pitched whine is the overrun."],
  n:["⚠️ હવે તરત START છોડો. લાંબો સમય ઓવરરન થાય તો ક્લચ અને બુશ બગડે.","⚠️ अब तुरंत START छोड़ें। ज़्यादा देर ओवररन से क्लच और बुश खराब होते हैं।","⚠️ Release START now. Prolonged overrun damages the clutch and bushes."]},
 {t:["ચાવી છૂટી: ચુંબક તૂટે, રિટર્ન","चाबी छोड़ी: चुंबक टूटा, रिटर्न","Key released: field collapses, return"],
  x:["S નો કરંટ બંધ થયો. કોન્ટેક્ટ હજુ બંધ છે એ ક્ષણે M માંથી કરંટ પુલ-ઇનમાં ઊલટી દિશામાં (ભૂરા કણ પાછા) અને હોલ્ડ-ઇનમાં સીધી દિશામાં વહે છે. બંનેનાં ચુંબક એકબીજાને રદ કરે છે, એટલે ક્ષેત્રની રેખાઓ સંકોચાઈને અદૃશ્ય થાય છે (ચુંબકત્વ તૂટે). હવે દબાયેલી રિટર્ન સ્પ્રિંગ પ્લન્જરને પાછો ધકેલે છે: પહેલાં કોન્ટેક્ટ ખૂલે, પછી લીવર પિનિયનને ફ્લાયવ્હીલથી પાછું ખેંચે.","S का करंट बंद हुआ। कॉन्टैक्ट अभी बंद है, उस पल M से करंट पुल-इन में उल्टी दिशा में (नीले कण वापस) और होल्ड-इन में सीधी दिशा में बहता है। दोनों के चुंबक एक-दूसरे को रद्द करते हैं, इसलिए क्षेत्र की रेखाएँ सिकुड़कर गायब हो जाती हैं (चुंबकत्व टूटता है)। अब दबी हुई रिटर्न स्प्रिंग प्लंजर को वापस धकेलती है: पहले कॉन्टैक्ट खुलता है, फिर लीवर पिनियन को फ्लाईव्हील से पीछे खींचता है।","S loses its supply. For the instant the contacts are still closed, current from M flows through the pull-in winding in reverse (cyan particles run back) and through the hold-in winding forward. Their magnetism cancels, so the field lines shrink and vanish (the field collapses). The compressed return spring now pushes the plunger back: the contacts open first, then the lever withdraws the pinion from the flywheel."],
  n:["બંને વાઇન્ડિંગના આંટા સરખા હોય છે, એટલે ઊલટા કરંટે ચુંબક બરાબર શૂન્ય થાય. 🐢 સ્લો મોશનમાં આ પગલું સ્પષ્ટ દેખાશે.","दोनों वाइंडिंग के फेरे बराबर होते हैं, इसलिए उल्टे करंट से चुंबक ठीक शून्य हो जाता है। 🐢 स्लो मोशन में यह कदम साफ़ दिखेगा।","Both windings have the same number of turns, so the opposing currents cancel the magnetism exactly. 🐢 Slow motion shows this step clearly."]},
 {t:["છૂટું પડ્યું","छूट गया","Disengaged"],
  x:["પિનિયન ફ્લાયવ્હીલથી દૂર છે અને આર્મેચર ધીમે ધીમે અટકે છે. એન્જિન પોતાની તાકાતથી ચાલે છે.","पिनियन फ्लाईव्हील से दूर है और आर्मेचर धीरे-धीरे रुकता है। इंजन अपनी ताकत से चलता है।","The pinion is clear of the flywheel and the armature coasts to a stop. The engine runs on its own."],
  x2:["એન્જિન ચાલુ ન થયું, ફક્ત ક્રેન્ક થયું. ⛽ ફ્યુઅલ ચાલુ રાખી START થોડી વધુ સેકન્ડ દબાવી રાખો.","इंजन चालू नहीं हुआ, सिर्फ क्रैंक हुआ। ⛽ फ्यूल चालू रखकर START कुछ सेकंड और दबाए रखें।","The engine did not start; it only cranked. Keep ⛽ fuel on and hold START a few seconds longer."],
  n:["⏹ એન્જિન બંધ દબાવી ફરી અજમાવી શકો.","⏹ इंजन बंद दबाकर फिर से आज़माएँ।","Press ⏹ Engine off to try again."]}
];

/* ================= DISMANTLING ================= */
const D=[
 {m:{},g:null,t:["0. ખોલતા પહેલાં","0. खोलने से पहले","0. Before dismantling"],
  x:["બેટરીનો નેગેટિવ ટર્મિનલ કાઢો. સ્ટાર્ટરના B અને S વાયર કાઢી, માઉન્ટિંગ બોલ્ટ ખોલી સ્ટાર્ટર ઉતારો. બહારથી સાફ કરી વાઇસમાં નરમ જડબાં (એલ્યુમિનિયમ કે લાકડું) વચ્ચે પકડો.","बैटरी का नेगेटिव टर्मिनल निकालें। स्टार्टर के B और S तार निकालकर, माउंटिंग बोल्ट खोलकर स्टार्टर उतारें। बाहर से साफ़ करके वाइस में नरम जबड़ों (एल्युमिनियम या लकड़ी) के बीच पकड़ें।","Disconnect the battery negative. Remove the B and S leads and the mounting bolts, and take the starter off. Clean the outside and hold it in a vice between soft jaws (aluminium or wood)."],
  n:["ખોલતા પહેલાં યોક અને બંને એન્ડ ફ્રેમ પર પંચ કે માર્કરથી નિશાની કરો.","खोलने से पहले योक और दोनों एंड फ्रेम पर पंच या मार्कर से निशान लगाएँ।","Mark the yoke and both end frames with a punch or marker before you start."]},
 {m:{strap:[2,3,3]},g:"strap",t:["1. ફીલ્ડ સ્ટ્રેપ છૂટો કરો","1. फील्ड स्ट्रैप खोलें","1. Disconnect the field strap"],
  x:["સોલેનોઇડના M ટર્મિનલનો નટ ખોલી ફીલ્ડ સ્ટ્રેપ (તાંબાની પટ્ટી) છૂટો કરો.","सोलेनॉइड के M टर्मिनल का नट खोलकर फील्ड स्ट्रैप (तांबे की पट्टी) अलग करें।","Undo the nut on solenoid terminal M and free the copper field strap."],
  n:["નટ ખોલતી વખતે બીજા સ્પેનરથી ટર્મિનલ બોલ્ટ પકડી રાખો, નહીં તો અંદરનો કોન્ટેક્ટ ફરી જાય.","नट खोलते समय दूसरे स्पैनर से टर्मिनल बोल्ट पकड़े रखें, वरना अंदर का कॉन्टैक्ट घूम जाता है।","Hold the terminal stud with a second spanner, or the internal contact will turn."]},
 {m:{sol:[1,5.5,-3]},g:"solhouse",t:["2. સોલેનોઇડ કાઢો","2. सोलेनॉइड निकालें","2. Remove the solenoid"],
  x:["સોલેનોઇડના 2–3 સ્ક્રૂ ખોલો. સોલેનોઇડ સહેજ નમાવી પ્લન્જરનો છેડો ડ્રાઇવ લીવરમાંથી છૂટો કરી બહાર કાઢો.","सोलेनॉइड के 2–3 स्क्रू खोलें। सोलेनॉइड थोड़ा झुकाकर प्लंजर का सिरा ड्राइव लीवर से अलग करके बाहर निकालें।","Remove the 2–3 solenoid screws. Tilt the solenoid to unhook the plunger from the drive lever and lift it out."],
  n:["પ્લન્જર અને રિટર્ન સ્પ્રિંગ ખોવાય નહીં તેનું ધ્યાન રાખો.","प्लंजर और रिटर्न स्प्रिंग खो न जाएँ।","Don't lose the plunger and return spring."]},
 {m:{bolts:[14,0,0]},g:"bolt",t:["3. થ્રૂ બોલ્ટ કાઢો","3. थ्रू बोल्ट निकालें","3. Remove the through bolts"],
  x:["પાછળના બે લાંબા થ્રૂ બોલ્ટ ખોલીને કાઢો. આ બોલ્ટ જ આખા સ્ટાર્ટરને જકડી રાખે છે.","पीछे के दो लंबे थ्रू बोल्ट खोलकर निकालें। यही बोल्ट पूरे स्टार्टर को कसकर रखते हैं।","Unscrew and withdraw the two long through bolts at the rear. These bolts hold the whole starter together."],
  n:["કેટલાક સ્ટાર્ટરમાં CE ફ્રેમ પર બ્રશ પ્લેટના બે નાના સ્ક્રૂ પણ હોય છે.","कुछ स्टार्टर में CE फ्रेम पर ब्रश प्लेट के दो छोटे स्क्रू भी होते हैं।","Some starters also have two small brush-plate screws in the end frame."]},
 {m:{ce:[8,0,0]},g:"cef",t:["4. CE ફ્રેમ (પાછળનું ઢાંકણ) કાઢો","4. CE फ्रेम (पीछे का ढक्कन) निकालें","4. Remove the commutator end frame"],
  x:["પાછળનું ઢાંકણ સીધું ખેંચીને કાઢો. અંદર CE બુશ અને થ્રસ્ટ વોશર છે.","पीछे का ढक्कन सीधा खींचकर निकालें। अंदर CE बुश और थ्रस्ट वॉशर हैं।","Pull the rear cover straight off. The CE bush and thrust washer are inside."],
  n:["વોશર અને શિમ ક્રમમાં રાખો; તે આર્મેચરનો એન્ડ પ્લે નક્કી કરે છે.","वॉशर और शिम क्रम में रखें; ये आर्मेचर का एंड प्ले तय करते हैं।","Keep washers and shims in order; they set the armature end play."]},
 {m:{brushes:[4.5,0,6]},g:"brush",t:["5. બ્રશ અને બ્રશ પ્લેટ કાઢો","5. ब्रश और ब्रश प्लेट निकालें","5. Remove brushes and brush plate"],
  x:["બ્રશ સ્પ્રિંગ પાછળ ખેંચી બ્રશ હોલ્ડરમાંથી ઉપાડો. પછી બ્રશ પ્લેટ કોમ્યુટેટર પરથી કાઢો.","ब्रश स्प्रिंग पीछे खींचकर ब्रश होल्डर से निकालें। फिर ब्रश प्लेट कम्यूटेटर से उतारें।","Lift the brush springs, slide the brushes out of their holders, then remove the brush plate from the commutator."],
  n:["બ્રશ સારા હોય તો તે કયા હોલ્ડરમાંથી નીકળ્યું તે નોંધો.","ब्रश अच्छे हों तो नोट करें कि कौन-सा ब्रश किस होल्डर से निकला।","If the brushes are re-usable, note which holder each came from."]},
 {m:{yoke:[0,-12,0]},g:"yoke",t:["6. યોક (ફીલ્ડ ફ્રેમ) કાઢો","6. योक (फील्ड फ्रेम) निकालें","6. Remove the yoke"],
  x:["યોકને આર્મેચર પરથી સરકાવી કાઢો. યોકની અંદર પોલ શૂ અને ફીલ્ડ કોઇલ લાગેલા રહે છે.","योक को आर्मेचर पर से सरकाकर निकालें। योक के अंदर पोल शू और फील्ड कॉइल लगे रहते हैं।","Slide the yoke off the armature. The pole shoes and field coils stay inside it."],
  n:["યોક સરકાવતાં ફીલ્ડ કોઇલ આર્મેચર સાથે ઘસાય નહીં તેનું ધ્યાન રાખો.","योक सरकाते समय फील्ड कॉइल आर्मेचर से न रगड़ें।","Don't let the field coils scrape the armature."]},
 {m:{de:[0,-9,-2],lever:[-4,4,0],plan:[0,5,-7]},g:"fork",np:["પ્લેનેટરી સ્ટાર્ટરમાં આર્મેચર કાઢતાં સન ગિયર તેની સાથે નીકળે છે. પછી રિંગ ગિયર, ત્રણ પ્લેનેટ અને કેરિયર એક સાથે બહાર કાઢો; ગ્રીસ અને દાંતા તપાસો.","प्लैनेटरी स्टार्टर में आर्मेचर निकालने पर सन गियर उसके साथ निकलता है। फिर रिंग गियर, तीनों प्लैनेट और कैरियर एक साथ बाहर निकालें; ग्रीस और दाँते जाँचें।","On a planetary starter the sun gear comes out with the armature. Then lift out the ring gear, three planets and carrier together; check the grease and teeth."],t:["7. આર્મેચર અને ડ્રાઇવ લીવર કાઢો","7. आर्मेचर और ड्राइव लीवर निकालें","7. Remove the armature and drive lever"],
  x:["રબર પેકિંગ અને લીવર સાથે આર્મેચરને ડ્રાઇવ એન્ડ ફ્રેમમાંથી બહાર કાઢો. પછી લીવરને ડ્રાઇવ કોલરમાંથી છૂટો કરો.","रबर पैकिंग और लीवर के साथ आर्मेचर को ड्राइव एंड फ्रेम से बाहर निकालें। फिर लीवर को ड्राइव कॉलर से अलग करें।","Withdraw the armature with the rubber seal and lever from the drive end frame, then unhook the lever from the drive collar."],
  n:["લીવરની દિશા યાદ રાખો; ઊંધો લાગે તો પિનિયન પૂરું આગળ નહીં જાય.","लीवर की दिशा याद रखें; उल्टा लगे तो पिनियन पूरा आगे नहीं जाएगा।","Note the lever's direction; fitted backwards, the pinion will not travel fully."]},
 {m:{drive:[-8,0,0],outs:[-8,0,0]},g:"pinion",t:["8. પિનિયન અને ક્લચ કાઢો","8. पिनियन और क्लच निकालें","8. Remove pinion and clutch"],
  x:["સ્ટોપ રિંગને પાઇપ કે સોકેટથી હળવેથી પાછળ ધકેલો, સર્કલિપ કાઢો, પછી સ્ટોપ રિંગ, પિનિયન અને ઓવરરનિંગ ક્લચ શાફ્ટ પરથી સરકાવી કાઢો.","स्टॉप रिंग को पाइप या सॉकेट से धीरे से पीछे धकेलें, सर्किलप निकालें, फिर स्टॉप रिंग, पिनियन और ओवररनिंग क्लच शाफ्ट से सरकाकर निकालें।","Tap the stop ring back with a tube or socket, remove the circlip, then slide the stop ring, pinion and overrunning clutch off the shaft."],
  n:["ઓવરરનિંગ ક્લચને ક્યારેય સોલ્વન્ટ કે ડીઝલમાં ડુબાડશો નહીં; અંદરની ગ્રીસ ધોવાઈ જાય છે.","ओवररनिंग क्लच को कभी सॉल्वेंट या डीज़ल में न डुबोएँ; अंदर की ग्रीस धुल जाती है।","Never soak the overrunning clutch in solvent or diesel; it washes out the sealed-in grease."]},
 {m:{},g:"core",t:["9. સફાઈ અને તપાસ","9. सफ़ाई और जाँच","9. Clean and inspect"],
  x:["બધા ભાગ ક્રમમાં ગોઠવો. આર્મેચર અને ફીલ્ડ કોઇલને સૂકા કપડા કે હવાથી સાફ કરો. પછી \"ઇન્સ્પેક્શન\" અને \"ટેસ્ટિંગ\" ટેબમાં દરેક ભાગ તપાસો.","सभी भाग क्रम में रखें। आर्मेचर और फील्ड कॉइल को सूखे कपड़े या हवा से साफ़ करें। फिर \"इंस्पेक्शन\" और \"टेस्टिंग\" टैब में हर भाग जाँचें।","Lay the parts out in order. Clean the armature and field coils with a dry cloth or air. Then check every part in the Inspection and Testing tabs."],
  n:["જોડતી વખતે આ જ પગલાં ઊલટા ક્રમમાં કરો. બુશમાં એન્જિન ઓઇલ અને સ્પ્લાઇન પર થોડી ગ્રીસ લગાવો.","जोड़ते समय यही कदम उल्टे क्रम में करें। बुश में इंजन ऑयल और स्प्लाइन पर थोड़ी ग्रीस लगाएँ।","Reassemble in reverse order. Oil the bushes and put a little grease on the splines."]}
];

/* ================= VISUAL INSPECTION ================= */
const OKF=["બરાબર, કોઈ ખામી નથી","ठीक है, कोई खराबी नहीं","Serviceable, no defect"];
const OKFIX=["ભાગ ફરી વાપરી શકાય. સાફ કરી જરૂર પ્રમાણે ઓઇલ કે ગ્રીસ લગાવો.","भाग दोबारा इस्तेमाल हो सकता है। साफ़ करके ज़रूरत के अनुसार ऑयल या ग्रीस लगाएँ।","Re-usable. Clean it and lubricate as required."];
const INSP=[
 {part:["def"],inside:false,dist:13,name:["ડ્રાઇવ એન્ડ હાઉસિંગ","ड्राइव एंड हाउसिंग","Drive end housing"],
  look:["માઉન્ટિંગ કાન અને ફ્લેન્જ પર તિરાડ, તૂટેલો ભાગ, બોલ્ટનાં કાણાં ઘસાયેલાં છે કે નહીં.","माउंटिंग कान और फ्लैंज पर दरार, टूटा भाग, बोल्ट के छेद घिसे हैं या नहीं।","Look for cracks or breaks on the mounting ears and flange, and worn bolt holes."],
  defects:[{d:"crack",f:["તિરાડ પડેલી છે","दरार है","Cracked"]}],distract:["ઓઇલ લીક","ऑयल लीक","Oil leak"],
  fix:["તિરાડવાળું હાઉસિંગ બદલો. એલ્યુમિનિયમ હાઉસિંગ વેલ્ડ ન કરો; કંપનથી ફરી તૂટે. માઉન્ટિંગ બોલ્ટ ઢીલા હતા કે નહીં તે પણ તપાસો.","दरार वाला हाउसिंग बदलें। एल्युमिनियम हाउसिंग वेल्ड न करें; कंपन से फिर टूटेगा। माउंटिंग बोल्ट ढीले थे या नहीं, यह भी जाँचें।","Replace a cracked housing; don't weld aluminium, vibration cracks it again. Also check whether the mounting bolts were loose."]},
 {part:["pinion"],inside:false,dist:9,name:["પિનિયન ગિયરના દાંતા","पिनियन गियर के दाँते","Pinion teeth"],
  look:["દાંતાના છેડા ગોળ ઘસાયેલા, તૂટેલા કે ચીરા પડેલા છે કે નહીં. દાંતાનો આગળનો ખૂણો (ચેમ્ફર) બરાબર છે ને.","दाँतों के सिरे घिसकर गोल, टूटे या चटके तो नहीं। दाँतों का आगे का कोना (चैम्फर) ठीक है न।","Look for rounded, chipped or broken teeth and check the leading chamfer."],
  defects:[{d:"pinionBad",f:["દાંતા ઘસાયેલા / તૂટેલા","दाँते घिसे / टूटे","Worn / broken teeth"]}],distract:["દાંતા પર કાટ","दाँतों पर जंग","Rust on teeth"],
  fix:["પિનિયન અને ઓવરરનિંગ ક્લચ એસેમ્બલી સાથે બદલો. ફ્લાયવ્હીલ રિંગ ગિયરના દાંતા પણ જરૂર તપાસો; ઘસાયેલા હોય તો રિંગ ગિયર બદલો.","पिनियन और ओवररनिंग क्लच असेंबली साथ बदलें। फ्लाईव्हील रिंग गियर के दाँते भी ज़रूर जाँचें; घिसे हों तो रिंग गियर बदलें।","Replace the pinion and overrunning clutch as an assembly. Always inspect the flywheel ring gear too and replace it if worn."]},
 {part:["clutch","rollers","pinion"],inside:false,dist:11,clutch:true,name:["ઓવરરનિંગ ક્લચ (હાથથી ફેરવીને)","ओवररनिंग क्लच (हाथ से घुमाकर)","Overrunning clutch (hand check)"],
  look:["પિનિયનને બંને દિશામાં ફેરવો. એક દિશામાં લોક થવું જોઈએ (આર્મેચર સાથે ફરે), અને બીજી દિશામાં છૂટું ફરવું જોઈએ. નીચેનાં બે બટન વાપરો.","पिनियन को दोनों दिशाओं में घुमाएँ। एक दिशा में लॉक होना चाहिए (आर्मेचर साथ घूमे) और दूसरी दिशा में खुला घूमना चाहिए। नीचे के दो बटन इस्तेमाल करें।","Turn the pinion both ways. It must lock in one direction (the armature turns with it) and spin freely in the other. Use the two buttons below."],
  defects:[{d:"slip",f:["બંને દિશામાં છૂટું ફરે (સ્લિપ)","दोनों दिशाओं में खुला घूमे (स्लिप)","Free both ways (slipping)"]},{d:"seized",f:["બંને દિશામાં લોક (જામ)","दोनों दिशाओं में लॉक (जाम)","Locked both ways (seized)"]}],
  fix:["ક્લચ સ્લિપ થાય તો સ્ટાર્ટર ફરે પણ એન્જિન ન ફરે. જામ હોય તો એન્જિન ચાલુ થયા પછી આર્મેચર વધુ ઝડપે ફરી ઊખડે. બંનેમાં ક્લચ એસેમ્બલી બદલો; તે રિપેર થતો નથી.","क्लच स्लिप हो तो स्टार्टर घूमता है पर इंजन नहीं। जाम हो तो इंजन चालू होने के बाद आर्मेचर ज़्यादा स्पीड से घूमकर उखड़ता है। दोनों में क्लच असेंबली बदलें; इसकी मरम्मत नहीं होती।","A slipping clutch spins without turning the engine; a seized one lets the engine over-speed and throw the armature. Replace the clutch assembly in both cases; it is not repairable."]},
 {part:["comm"],inside:true,dist:9,name:["કોમ્યુટેટરની સપાટી","कम्यूटेटर की सतह","Commutator surface"],
  look:["સપાટી સરખી અને તાંબાના ચળકાટવાળી છે કે નહીં. કાળા બળેલા સેગમેન્ટ, ખાડા, ઊંડા કાપા કે ઊંચું માઇકા જુઓ.","सतह समान और तांबे की चमक वाली है या नहीं। काले जले सेगमेंट, गड्ढे, गहरी खरोंच या ऊँचा माइका देखें।","The surface should be smooth with a copper sheen. Look for black burnt segments, pits, deep grooves or high mica."],
  defects:[{d:"commBurnt",f:["કાળું બળેલું અને ખાડાવાળું","काला जला और गड्ढेदार","Black, burnt and pitted"]}],distract:["ઊંચું માઇકા","ऊँचा माइका","High mica"],
  fix:["હળવું બળેલું હોય તો લેથ પર ટર્નિંગ કરી માઇકા અન્ડરકટ કરો. ઊંડા ખાડા કે ઓછો વ્યાસ હોય તો આર્મેચર બદલો. કારણ પણ શોધો: નબળી બ્રશ સ્પ્રિંગ કે લાંબું ક્રેન્કિંગ.","हल्का जला हो तो लेथ पर टर्निंग करके माइका अंडरकट करें। गहरे गड्ढे या कम व्यास हो तो आर्मेचर बदलें। कारण भी खोजें: कमज़ोर ब्रश स्प्रिंग या लंबी क्रैंकिंग।","Light burning: skim on a lathe and undercut the mica. Deep pits or undersize: replace the armature. Find the cause too, such as weak brush springs or long cranking."]},
 {part:["brush"],inside:true,dist:9,name:["કાર્બન બ્રશ","कार्बन ब्रश","Carbon brushes"],
  look:["બ્રશની લંબાઈ, તિરાડ, તૂટેલો ખૂણો, તેલ કે ગ્રીસ અને લીડ (પિગટેલ) બરાબર જોડાયેલી છે કે નહીં.","ब्रश की लंबाई, दरार, टूटा कोना, तेल या ग्रीस और लीड (पिगटेल) ठीक जुड़ी है या नहीं।","Check brush length, cracks, chipped edges, oil or grease, and that the pigtail lead is secure."],
  defects:[{d:"brushWorn",f:["બ્રશ ખૂબ ઘસાઈને ટૂંકા","ब्रश बहुत घिसकर छोटे","Worn too short"]}],distract:["બ્રશ પર તેલ","ब्रश पर तेल","Oil-soaked brushes"],
  fix:["મર્યાદાથી ટૂંકા બ્રશ આખા સેટમાં બદલો અને નવા બ્રશને કોમ્યુટેટર પર બેસાડો (બેડિંગ). બ્રશ સ્પ્રિંગ પણ તપાસો.","सीमा से छोटे ब्रश पूरे सेट में बदलें और नए ब्रश को कम्यूटेटर पर बैठाएँ (बेडिंग)। ब्रश स्प्रिंग भी जाँचें।","Replace brushes below the limit as a complete set and bed the new ones to the commutator. Check the springs too."]},
 {part:["bspring"],inside:true,dist:9,name:["બ્રશ સ્પ્રિંગ","ब्रश स्प्रिंग","Brush springs"],
  look:["ચારેય સ્પ્રિંગ હાજર, સીધી અને બ્રશ પર દબાણ આપે છે કે નહીં. તૂટેલી, ગરમીથી રંગ બદલાયેલી કે ઢીલી સ્પ્રિંગ જુઓ.","चारों स्प्रिंग मौजूद, सीधी और ब्रश पर दबाव दे रही हैं या नहीं। टूटी, गर्मी से रंग बदली या ढीली स्प्रिंग देखें।","All four springs should be present, straight and pressing on the brushes. Look for broken, heat-discoloured or weak springs."],
  defects:[{d:"springBroken",f:["એક સ્પ્રિંગ તૂટેલી / ગાયબ","एक स्प्रिंग टूटी / गायब","One spring broken / missing"]}],distract:["સ્પ્રિંગ પર કાટ","स्प्रिंग पर जंग","Rusty springs"],
  fix:["તૂટેલી સ્પ્રિંગ બદલો; ઘણીવાર આખી બ્રશ પ્લેટ એસેમ્બલી બદલવી સરળ પડે. એ બ્રશ પાસે કોમ્યુટેટર બળ્યું છે કે નહીં તે પણ જુઓ.","टूटी स्प्रिंग बदलें; अक्सर पूरी ब्रश प्लेट असेंबली बदलना आसान होता है। उस ब्रश के पास कम्यूटेटर जला है या नहीं, यह भी देखें।","Replace the broken spring; often it is easier to replace the whole brush-plate assembly. Check the commutator near that brush for burning."]},
 {part:["core"],inside:true,dist:13,name:["આર્મેચર કોરની સપાટી","आर्मेचर कोर की सतह","Armature core surface"],
  look:["કોર પર ચળકતા ઘસારાના પટ્ટા (રબિંગ માર્ક), વાંકો શાફ્ટ કે ઊખડેલી વાઇન્ડિંગ જુઓ.","कोर पर चमकती रगड़ की पट्टियाँ (रबिंग मार्क), टेढ़ा शाफ्ट या उखड़ी वाइंडिंग देखें।","Look for bright rubbing marks on the core, a bent shaft or lifted windings."],
  defects:[{d:"rubbing",f:["કોર પર ઘસારાના ચળકતા પટ્ટા","कोर पर रगड़ की चमकती पट्टियाँ","Bright rubbing marks on the core"]}],distract:["કોર પર કાટ","कोर पर जंग","Rust on the core"],
  fix:["રબિંગનો અર્થ: બુશ ઘસાયેલા છે, શાફ્ટ વાંકો છે કે પોલ શૂ ઢીલો છે. બુશ બદલો, રનઆઉટ તપાસો અને પોલ શૂ સ્ક્રૂ કસો. કોરને નુકસાન હોય તો આર્મેચર બદલો.","रगड़ का अर्थ: बुश घिसे हैं, शाफ्ट टेढ़ा है या पोल शू ढीला है। बुश बदलें, रनआउट जाँचें और पोल शू स्क्रू कसें। कोर खराब हो तो आर्मेचर बदलें।","Rubbing means worn bushes, a bent shaft or a loose pole shoe. Replace the bushes, check run-out and tighten the pole-shoe screws. Replace the armature if the core is damaged."]},
 {part:["field"],inside:true,dist:13,name:["ફીલ્ડ કોઇલનું ઇન્સ્યુલેશન","फील्ड कॉइल का इंसुलेशन","Field coil insulation"],
  look:["કોઇલનો રંગ, બળેલું કે કાળું ઇન્સ્યુલેશન, બળવાની ગંધ અને ઢીલા પોલ શૂ જુઓ.","कॉइल का रंग, जला या काला इंसुलेशन, जलने की गंध और ढीले पोल शू देखें।","Look at the coil colour, burnt or blackened insulation, a burnt smell and loose pole shoes."],
  defects:[{d:"fieldBurnt",f:["ઇન્સ્યુલેશન બળેલું / કાળું","इंसुलेशन जला / काला","Burnt / blackened insulation"]}],distract:["પોલ શૂ ઢીલો","पोल शू ढीला","Loose pole shoe"],
  fix:["લાંબા સમય સુધી સતત ક્રેન્કિંગથી કોઇલ વધુ ગરમ થઈ છે. ફીલ્ડ કોઇલ (કે યોક એસેમ્બલી) બદલો અને ગ્રાઉન્ડ ટેસ્ટ કરો. ડ્રાઇવરને 10–15 સેકન્ડથી વધુ ક્રેન્ક ન કરવાનું સમજાવો.","लंबे समय तक लगातार क्रैंकिंग से कॉइल ज़्यादा गर्म हुई है। फील्ड कॉइल (या योक असेंबली) बदलें और ग्राउंड टेस्ट करें। ड्राइवर को 10–15 सेकंड से ज़्यादा क्रैंक न करने को समझाएँ।","The coils overheated from prolonged cranking. Replace the field coils (or yoke assembly) and do a ground test. Tell the driver not to crank for more than 10–15 seconds."]},
 {part:["contact"],inside:true,dist:9,name:["સોલેનોઇડ કોન્ટેક્ટ પ્લેટ","सोलेनॉइड कॉन्टैक्ट प्लेट","Solenoid contact disc"],
  look:["કોન્ટેક્ટ પ્લેટ અને ટર્મિનલના છેડા સરખા અને તાંબાના રંગના છે કે નહીં. બળેલા, ખાડાવાળા કે ઓગળેલા ભાગ જુઓ.","कॉन्टैक्ट प्लेट और टर्मिनल के सिरे समतल और तांबे के रंग के हैं या नहीं। जले, गड्ढेदार या पिघले भाग देखें।","The disc and terminal faces should be flat and copper-coloured. Look for burnt, pitted or melted areas."],
  defects:[{d:"contactBurnt",f:["બળેલી અને ખાડાવાળી","जली और गड्ढेदार","Burnt and pitted"]}],distract:["પ્લન્જર પર કાટ","प्लंजर पर जंग","Rusty plunger"],
  fix:["આ જ કારણે \"ટક\" આવે પણ મોટર ન ફરે. કોન્ટેક્ટ કિટ (પ્લેટ અને બંને ટર્મિનલ) કે આખો સોલેનોઇડ બદલો. કોન્ટેક્ટ ઘસીને ચલાવવું ફક્ત કામચલાઉ ઉપાય છે.","इसी कारण \"टक\" आता है पर मोटर नहीं घूमती। कॉन्टैक्ट किट (प्लेट और दोनों टर्मिनल) या पूरा सोलेनॉइड बदलें। कॉन्टैक्ट घिसकर चलाना सिर्फ अस्थायी उपाय है।","This is why it clicks but won't crank. Fit a contact kit (disc and both terminals) or a new solenoid; filing the contacts is only a temporary fix."]},
 {part:["termB","termM"],inside:false,dist:9,name:["B અને M ટર્મિનલ","B और M टर्मिनल","B and M terminals"],
  look:["ટર્મિનલ પર લીલો-સફેદ કાટ, ઢીલો નટ, તૂટેલું ઇન્સ્યુલેશન કે ગરમીથી રંગ બદલાયો છે કે નહીં.","टर्मिनल पर हरा-सफ़ेद जंग, ढीला नट, टूटा इंसुलेशन या गर्मी से रंग बदला है या नहीं।","Look for green-white corrosion, loose nuts, cracked insulation or heat discolouration."],
  defects:[{d:"corrosion",f:["લીલો-સફેદ કાટ","हरा-सफ़ेद जंग","Green-white corrosion"]}],distract:["નટ ઢીલો","नट ढीला","Loose nut"],
  fix:["કેબલ કાઢો, વાયર બ્રશ અને ખાવાના સોડાના પાણીથી સાફ કરો, સૂકવીને કસો અને ઉપર પેટ્રોલિયમ જેલી લગાવો. પછી વોલ્ટેજ ડ્રોપ ટેસ્ટ કરો.","केबल निकालें, वायर ब्रश और खाने के सोडे के पानी से साफ़ करें, सुखाकर कसें और ऊपर पेट्रोलियम जेली लगाएँ। फिर वोल्टेज ड्रॉप टेस्ट करें।","Disconnect, clean with a wire brush and baking-soda solution, dry, tighten and coat with petroleum jelly. Then do a voltage-drop test."]},
 {part:["debush","cebush"],inside:true,dist:22,name:["બુશ (આગળ અને પાછળ)","बुश (आगे और पीछे)","Bushes (front and rear)"],
  look:["બુશમાં શાફ્ટ હલાવી રમત (પ્લે) જુઓ. બુશ ગરમીથી ભૂરો-જાંબલી, ઘસાયેલો કે અંડાકાર તો નથી ને.","बुश में शाफ्ट हिलाकर खेल (प्ले) देखें। बुश गर्मी से नीला-बैंगनी, घिसा या अंडाकार तो नहीं।","Rock the shaft to feel for play. Check for blued (overheated), scored or oval bushes."],
  defects:[{d:"bushWorn",f:["ગરમીથી ભૂરા અને ઘસાયેલા","गर्मी से नीले और घिसे","Blued and worn"]}],distract:["બુશમાં વધુ ગ્રીસ","बुश में ज़्यादा ग्रीस","Too much grease"],

 {f:["pinion"],q:["પિનિયનમાં 10 અને રિંગ ગિયરમાં 120 દાંતા છે. આર્મેચર 2400 rpm પર ફરે તો એન્જિન કેટલું ફરે?","पिनियन में 10 और रिंग गियर में 120 दाँते हैं। आर्मेचर 2400 rpm पर घूमे तो इंजन कितना घूमेगा?","Pinion 10 teeth, ring gear 120 teeth. With the armature at 2400 rpm, the engine turns at:"],o:["20 rpm","200 rpm","1200 rpm","28 800 rpm"],a:1,e:["ગિયર રેશિયો = 120 ÷ 10 = 12:1. 2400 ÷ 12 = 200 rpm, અને ટોર્ક 12 ગણો.","गियर अनुपात = 120 ÷ 10 = 12:1। 2400 ÷ 12 = 200 rpm, और टॉर्क 12 गुना।","Ratio = 120 ÷ 10 = 12:1, so 2400 ÷ 12 = 200 rpm, with 12 × the torque."]},
 {f:["winding"],q:["સ્ટાર્ટર ઝડપથી ફરવા લાગે તેમ કરંટ કેમ ઘટે છે?","स्टार्टर तेज़ घूमने लगे तो करंट क्यों घटता है?","Why does starter current fall as speed rises?"],o:[["બ્રશ ગરમ થાય","ब्रश गर्म होते हैं","The brushes heat up"],["બેક EMF વધે","बैक EMF बढ़ता है","Back EMF rises"],["બેટરી ચાર્જ થાય","बैटरी चार्ज होती है","The battery charges"],["ફીલ્ડ કોઇલ બંધ થાય","फील्ड कॉइल बंद होती है","The field coil switches off"]],a:1,e:["ફરતું આર્મેચર ઊલટો વોલ્ટેજ (બેક EMF) બનાવે છે. I = (V − Eb) ÷ R, એટલે ઝડપ વધે તેમ કરંટ ઘટે. સ્થિર હોય ત્યારે Eb = 0, એટલે કરંટ સૌથી વધુ.","घूमता आर्मेचर उल्टा वोल्टेज (बैक EMF) बनाता है। I = (V − Eb) ÷ R, इसलिए गति बढ़ने पर करंट घटता है। रुका हो तो Eb = 0, इसलिए करंट सबसे ज़्यादा।","A turning armature generates a back EMF. I = (V − Eb) ÷ R, so current falls as speed rises; at standstill Eb = 0 and current is highest."]},
 {f:["field","winding"],q:["DC સિરીઝ મોટરમાં (સેચ્યુરેશન પહેલાં) ટોર્ક કરંટ સાથે કેવી રીતે બદલાય?","DC सीरीज़ मोटर में (सैचुरेशन से पहले) टॉर्क करंट के साथ कैसे बदलता है?","In a DC series motor (below saturation), torque varies with current as:"],o:["T ∝ I","T ∝ I²","T ∝ 1/I","T ∝ √I"],a:1,e:["સિરીઝ મોટરમાં ફ્લક્સ Φ ∝ I અને T ∝ Φ × I, એટલે T ∝ I². તેથી શરૂઆતના મોટા કરંટે ખૂબ મોટો ટોર્ક મળે.","सीरीज़ मोटर में फ्लक्स Φ ∝ I और T ∝ Φ × I, इसलिए T ∝ I²। शुरुआती बड़े करंट पर बहुत बड़ा टॉर्क मिलता है।","In a series motor Φ ∝ I and T ∝ Φ × I, so T ∝ I². The high starting current gives very high torque."]},
 {show:["planet"],plan:true,q:["3D મોડલમાં ચમકતાં ત્રણ ગિયરને શું કહે?","3D मॉडल में चमकते तीन गियर को क्या कहते हैं?","What are the three glowing gears called?"],o:[["સન ગિયર","सन गियर","Sun gear"],["પ્લેનેટ ગિયર","प्लैनेट गियर","Planet gears"],["રિંગ ગિયર","रिंग गियर","Ring gear"],["પિનિયન","पिनियन","Pinion"]],a:1,e:["પ્લેનેટ ગિયર સન ફરતે ફરે અને રિંગ ગિયરના અંદરના દાંતામાં ચાલે.","प्लैनेट गियर सन के चारों ओर घूमते हैं और रिंग गियर के अंदर के दाँतों में चलते हैं।","Planet gears orbit the sun and roll inside the ring gear."]},
 {show:["ringgear"],plan:true,q:["ચાલુ સ્ટાર્ટરમાં ચમકતો ભાગ શું કરે છે?","चालू स्टार्टर में चमकता भाग क्या करता है?","In a running starter, what does the glowing part do?"],o:[["સ્થિર રહે છે","स्थिर रहता है","Stays stationary"],["સન સાથે ફરે","सन के साथ घूमता है","Turns with the sun"],["કેરિયર સાથે ફરે","कैरियर के साथ घूमता है","Turns with the carrier"],["ઊલટું ફરે","उल्टा घूमता है","Turns backwards"]],a:0,e:["રિંગ ગિયર હાઉસિંગ સાથે સ્થિર રહે છે; એટલે જ ઝડપ ઘટે અને ટોર્ક વધે.","रिंग गियर हाउसिंग के साथ स्थिर रहता है; इसी से गति घटती है और टॉर्क बढ़ता है।","The ring gear is held in the housing; that is what produces the reduction."]},
 {f:["sun","carrier"],plan:true,q:["સન 10 અને રિંગ 40 દાંતા, રિંગ સ્થિર. આર્મેચર 5000 rpm હોય તો કેરિયર કેટલું ફરે?","सन 10 और रिंग 40 दाँते, रिंग स्थिर। आर्मेचर 5000 rpm हो तो कैरियर कितना घूमेगा?","Sun 10 teeth, ring 40 teeth, ring held. With the armature at 5000 rpm, the carrier turns at:"],o:["500 rpm","1000 rpm","1250 rpm","4000 rpm"],a:1,e:["રેશિયો = (40 + 10) ÷ 10 = 5:1. 5000 ÷ 5 = 1000 rpm.","अनुपात = (40 + 10) ÷ 10 = 5:1। 5000 ÷ 5 = 1000 rpm।","Ratio = (40 + 10) ÷ 10 = 5:1, so 5000 ÷ 5 = 1000 rpm."]}

const TH={
 cTitle:["સ્ટાર્ટિંગ સર્કિટ","स्टार्टिंग सर्किट","Starting circuit"],
 cTxt:["સ્ટાર્ટિંગ સિસ્ટમમાં બે સર્કિટ છે. કંટ્રોલ સર્કિટ ચાવી, સેફ્ટી સ્વિચ અને સોલેનોઇડ વાઇન્ડિંગમાંથી થોડા એમ્પિયર જ લે છે. મુખ્ય સર્કિટ જાડા કેબલ, સોલેનોઇડ કોન્ટેક્ટ અને મોટરમાંથી 150–300 A લે છે. ન્યુટ્રલ / ક્લચ સેફ્ટી સ્વિચ ગિયર લાગેલો હોય ત્યારે ગાડી સ્ટાર્ટ થતી અટકાવે છે.","स्टार्टिंग सिस्टम में दो सर्किट होते हैं। कंट्रोल सर्किट चाबी, सेफ्टी स्विच और सोलेनॉइड वाइंडिंग से केवल कुछ एम्पियर लेता है। मुख्य सर्किट मोटी केबल, सोलेनॉइड कॉन्टैक्ट और मोटर से 150–300 A लेता है। न्यूट्रल / क्लच सेफ्टी स्विच गियर में होने पर गाड़ी स्टार्ट होने से रोकता है।","A starting system has two circuits. The control circuit (key, safety switch, solenoid windings) carries only a few amperes. The main circuit (heavy cables, solenoid contacts, motor) carries 150–300 A. The neutral / clutch safety switch prevents starting in gear."],
 bat:["બેટરી","बैटरी","Battery"],ign:["ઇગ્નિશન સ્વિચ (START)","इग्निशन स्विच (START)","Ignition switch (START)"],nss:["સેફ્ટી સ્વિચ","सेफ्टी स्विच","Safety switch"],sol:["સોલેનોઇડ","सोलेनॉइड","Solenoid"],mot:["મોટર","मोटर","Motor"],
 main:["મુખ્ય સર્કિટ (મોટો કરંટ)","मुख्य सर्किट (बड़ा करंट)","Main circuit (heavy current)"],ctrl:["કંટ્રોલ સર્કિટ (નાનો કરંટ)","कंट्रोल सर्किट (छोटा करंट)","Control circuit (small current)"],
 mTitle:["DC સિરીઝ મોટરનો સિદ્ધાંત","DC सीरीज़ मोटर का सिद्धांत","DC series motor principle"],
 mTxt:["ફીલ્ડ અને આર્મેચર શ્રેણીમાં હોવાથી એ જ કરંટ બંનેમાંથી જાય છે. ચુંબકીય ક્ષેત્રમાં રહેલા કરંટવાળા કંડક્ટર પર બળ લાગે છે (ફ્લેમિંગનો ડાબા હાથનો નિયમ), અને એ બળ આર્મેચરને ફેરવે છે. ફરતું આર્મેચર બેક EMF (Eb) બનાવે છે, જે બેટરી વોલ્ટેજની વિરુદ્ધ હોય છે. સ્થિર હોય ત્યારે Eb = 0, એટલે કરંટ અને ટોર્ક બંને સૌથી વધુ. એન્જિન ફરવા લાગે તેમ Eb વધે અને કરંટ ઘટે.","फील्ड और आर्मेचर श्रेणी में होने से वही करंट दोनों से बहता है। चुंबकीय क्षेत्र में रखे करंट वाले कंडक्टर पर बल लगता है (फ्लेमिंग का बाएँ हाथ का नियम), और वह बल आर्मेचर को घुमाता है। घूमता आर्मेचर बैक EMF (Eb) बनाता है, जो बैटरी वोल्टेज के विपरीत होता है। रुका हो तो Eb = 0, इसलिए करंट और टॉर्क दोनों सबसे ज़्यादा। इंजन घूमने लगे तो Eb बढ़ता है और करंट घटता है।","Field and armature are in series, so the same current flows through both. A current-carrying conductor in a magnetic field feels a force (Fleming's left-hand rule), and that force turns the armature. The turning armature generates a back EMF (Eb) opposing the battery. At standstill Eb = 0, so current and torque are at their maximum; as the engine speeds up, Eb rises and current falls."],
 ex:["ઉદાહરણ: V = 12 V, કુલ રેઝિસ્ટન્સ (આર્મેચર + ફીલ્ડ + બ્રશ + કેબલ + બેટરી) ≈ 0.04 Ω. સ્થિર સ્થિતિમાં I = 12 ÷ 0.04 = 300 A. ક્રેન્કિંગ વખતે Eb ≈ 6 V થાય તો I = (12 − 6) ÷ 0.04 = 150 A. (આંકડા સમજવા માટેના અંદાજિત છે.)","उदाहरण: V = 12 V, कुल रेज़िस्टेंस (आर्मेचर + फील्ड + ब्रश + केबल + बैटरी) ≈ 0.04 Ω। रुकी स्थिति में I = 12 ÷ 0.04 = 300 A। क्रैंकिंग के समय Eb ≈ 6 V हो तो I = (12 − 6) ÷ 0.04 = 150 A। (आँकड़े समझाने के लिए अनुमानित हैं।)","Example: V = 12 V, total resistance (armature + field + brushes + cables + battery) ≈ 0.04 Ω. At standstill I = 12 ÷ 0.04 = 300 A. While cranking, if Eb ≈ 6 V then I = (12 − 6) ÷ 0.04 = 150 A. (Illustrative figures.)"],
 warn:["સિરીઝ મોટરને ભાર વગર લાંબો સમય ન ચલાવો: કરંટ ઘટતાં ફ્લક્સ ઘટે અને ઝડપ ખૂબ વધી જાય.","सीरीज़ मोटर को बिना भार देर तक न चलाएँ: करंट घटने से फ्लक्स घटता है और गति बहुत बढ़ जाती है।","Never run a series motor off load for long: as current falls the flux falls and the speed runs away."],
 gTitle:["લાક્ષણિક વળાંક (અંદાજિત)","विशेषता वक्र (अनुमानित)","Characteristic curves (illustrative)"],
 gTxt:["કરંટ વધે તેમ ટોર્ક ઝડપથી વધે અને ઝડપ ઘટે. પાવર વચ્ચેના કરંટે સૌથી વધુ હોય. તેથી સ્ટાર્ટર ઓછી ઝડપે મોટો ટોર્ક આપે છે, જે એન્જિનનું કમ્પ્રેશન તોડવા માટે જ જોઈએ.","करंट बढ़ने पर टॉर्क तेज़ी से बढ़ता है और गति घटती है। पावर बीच के करंट पर सबसे ज़्यादा होती है। इसलिए स्टार्टर कम गति पर बड़ा टॉर्क देता है, जो इंजन का कम्प्रेशन तोड़ने के लिए ज़रूरी है।","As current rises, torque climbs steeply and speed falls. Power peaks at a middle current. That is why a starter gives high torque at low speed, exactly what is needed to overcome engine compression."],
 speed:["ઝડપ","गति","Speed"],torque:["ટોર્ક","टॉर्क","Torque"],power:["પાવર","पावर","Power"],axis:["કરંટ (A)","करंट (A)","Current (A)"],
 plTitle:["પ્લેનેટરી ગિયર રિડક્શન (PLGR)","प्लैनेटरी गियर रिडक्शन (PLGR)","Planetary gear reduction (PLGR)"],
 plTxt:["આર્મેચર શાફ્ટ પરનું સન ગિયર ત્રણ પ્લેનેટ ગિયરને ફેરવે છે. પ્લેનેટ ગિયર સ્થિર રિંગ ગિયરના અંદરના દાંતામાં ચાલે છે, એટલે તેઓ સન ફરતે ચક્કર મારે અને કેરિયરને ધીમે ધીમે ફેરવે. ભાર ત્રણ પ્લેનેટમાં વહેંચાઈ જાય છે, એટલે નાનું ગિયર સેટ પણ મોટો ટોર્ક સહન કરે. તેથી નાની, હલકી અને ઝડપી મોટર પૂરતો ક્રેન્કિંગ ટોર્ક આપે છે અને બેટરીમાંથી ઓછો કરંટ લે છે.","आर्मेचर शाफ्ट पर लगा सन गियर तीन प्लैनेट गियर को घुमाता है। प्लैनेट गियर स्थिर रिंग गियर के अंदर के दाँतों में चलते हैं, इसलिए वे सन के चारों ओर चक्कर लगाते हैं और कैरियर को धीरे-धीरे घुमाते हैं। भार तीन प्लैनेट में बँट जाता है, इसलिए छोटा गियर सेट भी बड़ा टॉर्क सह लेता है। इसलिए छोटी, हल्की और तेज़ मोटर पर्याप्त क्रैंकिंग टॉर्क देती है और बैटरी से कम करंट लेती है।","The sun gear on the armature shaft drives three planet gears. The planets roll inside the stationary ring gear, so they orbit the sun and turn the carrier slowly. The load is shared by three planets, so a compact set carries high torque. A small, light, fast motor therefore gives enough cranking torque while drawing less current."],
 plEx:["ઉદાહરણ: સન 10, રિંગ 40, પ્લેનેટ 15 દાંતા (રિંગ સ્થિર). રેશિયો = (40 + 10) ÷ 10 = 5:1. આર્મેચર 5000 rpm → કેરિયર 1000 rpm. પછી પિનિયન 10 અને ફ્લાયવ્હીલ 96 દાંતા → એન્જિન 1000 ÷ 9.6 ≈ 104 rpm. કુલ રેશિયો 5 × 9.6 = 48:1.","उदाहरण: सन 10, रिंग 40, प्लैनेट 15 दाँते (रिंग स्थिर)। अनुपात = (40 + 10) ÷ 10 = 5:1। आर्मेचर 5000 rpm → कैरियर 1000 rpm। फिर पिनियन 10 और फ्लाईव्हील 96 दाँते → इंजन 1000 ÷ 9.6 ≈ 104 rpm। कुल अनुपात 5 × 9.6 = 48:1।","Example: sun 10, ring 40, planets 15 teeth (ring held). Ratio = (40 + 10) ÷ 10 = 5:1. Armature 5000 rpm → carrier 1000 rpm. Then pinion 10 and flywheel 96 teeth → engine 1000 ÷ 9.6 ≈ 104 rpm. Overall ratio 5 × 9.6 = 48:1."],

let lamTex=null;
function mat(key){
 if(key==="lam"){ if(!lamTex){const c=document.createElement("canvas");c.width=64;c.height=256;const x=c.getContext("2d");x.fillStyle="#a2abb4";x.fillRect(0,0,64,256);x.fillStyle="#5c656e";for(let y=0;y<256;y+=4)x.fillRect(0,y,64,1);lamTex=new THREE.CanvasTexture(c);lamTex.wrapS=lamTex.wrapT=THREE.RepeatWrapping;lamTex.repeat.set(1,3);lamTex.encoding=THREE.sRGBEncoding}
  return new THREE.MeshStandardMaterial({map:lamTex,metalness:.75,roughness:.42,side:THREE.DoubleSide}); }
 const o=Object.assign({side:THREE.DoubleSide},MAT[key]||MAT.steel);const phys=o.phys;delete o.phys;

function add(parent,geo,key,part){

const PI=Math.PI;
function cylX(r,len,x0,seg){const g=new THREE.CylinderGeometry(r,r,len,seg||40,1);g.rotateZ(-PI/2);g.translate(x0+len/2,0,0);return g}
function latheX(prof,seg,ps,pl){const g=new THREE.LatheGeometry(prof.map(p=>new THREE.Vector2(p[0],p[1])),seg||56,ps||0,pl===undefined?2*PI:pl);g.rotateZ(-PI/2);return g}
function tubeX(rIn,rOut,x0,x1,seg,ps,pl){return latheX([[rIn,x0],[rOut,x0],[rOut,x1],[rIn,x1],[rIn,x0]],seg,ps,pl)}
function gearShape(rRoot,rTip,n,holeR){
 const s=new THREE.Shape();const st=2*PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[rRoot,a],[rTip,a+st*.2],[rTip,a+st*.45],[rRoot,a+st*.65]].forEach(([r,an],j)=>{const x=r*Math.cos(an),y=r*Math.sin(an);(i===0&&j===0)?s.moveTo(x,y):s.lineTo(x,y)})}
 s.closePath();
 if(holeR){const h=new THREE.Path();h.absarc(0,0,holeR,0,2*PI,true);s.holes.push(h)}
 return s;
}
function gearX(rRoot,rTip,n,holeR,w,x0){const g=new THREE.ExtrudeGeometry(gearShape(rRoot,rTip,n,holeR),{depth:w,bevelEnabled:false,curveSegments:18});g.rotateY(PI/2);g.translate(x0,0,0);return g}
class Helix extends THREE.Curve{constructor(len,r,turns,ph){super();this.len=len;this.r=r;this.tn=turns;this.ph=ph||0}getPoint(t,o){o=o||new THREE.Vector3();const a=t*this.tn*2*PI+this.ph;return o.set(t*this.len,this.r*Math.cos(a),this.r*Math.sin(a))}}
function helix(len,r,turns,tube,ph){return new THREE.TubeGeometry(new Helix(len,r,turns,ph),Math.min(1400,Math.max(40,Math.round(turns*18))),tube,6,false)}
const V=p=>new THREE.Vector3(p[0],p[1],p[2]);
function pathTube(pts,r,seg){return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(V)),seg||64,r,8,false)}
function racetrack(r,u0,u1,phiC,phiH,cr){
 const v0=r*(phiC-phiH),v1=r*(phiC+phiH),pts=[];
 [[u1-cr,v0+cr,-PI/2],[u1-cr,v1-cr,0],[u0+cr,v1-cr,PI/2],[u0+cr,v0+cr,PI]].forEach(([cu,cv,st])=>{for(let k=0;k<=6;k++){const a=st+k/6*PI/2;const u=cu+cr*Math.cos(a),v=cv+cr*Math.sin(a),f=v/r;pts.push(new THREE.Vector3(u,-r*Math.sin(f),r*Math.cos(f)))}});
 return new THREE.CatmullRomCurve3(pts,true,"centripetal");
}

/* ---- picking ---- */
function visibleChain(o){while(o){if(!o.visible)return false;o=o.parent}return true}
function setupPick(cv){
 const rc=new THREE.Raycaster(),p=new THREE.Vector2();let down=null;
 cv.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY]});
 cv.addEventListener("pointerup",e=>{
  if(!down)return;const d=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(d>6)return;
  const r=cv.getBoundingClientRect();p.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  rc.setFromCamera(p,camera);
  const hits=rc.intersectObjects(allMeshes,false).filter(h=>visibleChain(h.object)&&!(cutOn&&SHELL.has(h.object.userData.part)&&h.point.z>.02)&&!(xrayOn&&SHELL.has(h.object.userData.part)));
  const hit=hits[0]||rc.intersectObjects(allMeshes,false).filter(h=>visibleChain(h.object)&&!(cutOn&&SHELL.has(h.object.userData.part)&&h.point.z>.02))[0];
  if(hit)onPick(hit.object.userData.part);
 });
}

/* ---- physics of one start ---- */
function stepSim(dt){
 const k=sim.key;
 if(k)sim.plg=Math.min(1,sim.plg+dt*(sim.plg<.6?3.0:1.8));else sim.plg=Math.max(0,sim.plg-dt*4.5);
 if(!sim.contact&&k&&sim.plg>=.985){sim.contact=true;sim.contactT=0;SND.hit(.9,900);buzz(45)}
 if(sim.contact&&sim.plg<.9){sim.contact=false;SND.hit(.35,1600)}
 const meshed=sim.plg>.8;
 sim.iHold=(k||sim.contact)?1:0;
 sim.iPull=k?(sim.contact?0:1):(sim.contact?-1:0);
 const mmf=sim.iHold*.45+sim.iPull*.55;
 const tS=Math.abs(mmf)<.15?0:Math.min(1,Math.abs(mmf));
 sim.sSol+=(tS-sim.sSol)*Math.min(1,dt*(tS>sim.sSol?9:16));
 if(sim.contact){sim.contactT+=dt;if(sim.engine==="off"){sim.engine="crank";sim.crankT=0}}
 if(sim.engine==="crank"){if(!sim.contact)sim.engine="off";else{sim.crankT+=dt;if(sim.fuel&&sim.crankT>2.4){sim.engine="run";SND.hit(.7,400);buzz(140)}}}
 const ripple=sim.engine==="crank"?Math.sin(sim.ringAng*2):0;
 let armT=0;
 const AF=PLAN?3.5:1;
 if(sim.contact)armT=(sim.engine==="run"?26:19*(1+.12*ripple))*AF;
 else if(k&&sim.iPull>0)armT=3.2*AF;
 sim.arm+=(armT-sim.arm)*Math.min(1,dt*(armT>sim.arm?4.5:1.1));
 if(sim.engine==="run")sim.ring+=(8-sim.ring)*Math.min(1,dt*1.6);
 else if(sim.contact&&meshed)sim.ring=sim.arm/(PLAN?PR:1)/9.6;
 else sim.ring*=1-Math.min(1,dt*1.0);
 const outW=sim.arm/(PLAN?PR:1);
 sim.pin=(meshed&&sim.ring*9.6>outW)?sim.ring*9.6:outW;
 sim.iMain=sim.contact?(sim.engine==="run"?65:115+190*Math.exp(-sim.contactT*3.2)+28*ripple):0;
 const tF=sim.iMain>0?Math.min(1,sim.iMain/150):0;
 sim.sField+=(tF-sim.sField)*Math.min(1,dt*(tF>sim.sField?8:12));
 sim.relT=k?0:sim.relT+dt;
 sim.ringAng+=sim.ring*dt;
 if(sim.engine==="crank"){sim.vibT-=dt;if(sim.vibT<=0){buzz(40);sim.vibT=.2}}
 sim.shake=sim.engine==="crank"?.05*(.7+.3*ripple):(sim.engine==="run"?.016:(sim.contact?.025:0));
 const ph=k?(!sim.contact?(sim.plg<.3?1:2):(sim.engine==="run"?5:(sim.contactT<.7?3:4))):(sim.plg>.03?6:(sim.phase>=1?7:0));
 if(ph!==sim.phase){sim.phase=ph;renderPhase(ph)}
}
