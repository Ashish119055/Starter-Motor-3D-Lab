 <div class="panel"><h2>${esc(L(TH.gTitle))}</h2><div class="svgwrap">${curvesSVG()}</div><p>${esc(L(TH.gTxt))}</p></div>
 <div class="panel"><h2>${esc(L(TH.rTitle))}</h2><p>${esc(L(TH.rTxt))}</p></div>
 <div class="panel"><h2>${esc(L(TH.plTitle))}</h2><div class="svgwrap">${planSVG()}</div><div class="eqs"><code>i = (Z<sub>ring</sub> + Z<sub>sun</sub>) ÷ Z<sub>sun</sub></code><code>N<sub>carrier</sub> = N<sub>sun</sub> ÷ i ,  T<sub>carrier</sub> ≈ T<sub>sun</sub> × i</code></div><p>${esc(L(TH.plTxt))}</p><div class="note">${esc(L(TH.plEx))}</div></div>
 <div class="panel"><h2>${esc(L(TH.tTitle))}</h2><div class="tblwrap"><table class="rep"><thead><tr>${TH.tCols.map(c=>`<th>${esc(L(c))}</th>`).join("")}</tr></thead><tbody>${TH.tRows.map(r=>`<tr>${r.map(c=>`<td>${esc(L(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
 <div class="panel"><h2>${esc(L(TH.pTitle))}</h2><ul class="plist">${TH.pList.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul></div>`;
 post();
}

/* ================= QUIZ TAB ================= */
let qi=0,qs=0,qDone=false;
function showQ(i,keep){
 qi=i;if(!keep)qDone=false;const q=Q[i];
 if(q.plan&&!PLAN&&mode==="quiz"){setPlan(true,true);planChanged(true)}
 $("qHead").textContent=`${tr("q")} ${i+1} / ${Q.length}`;$("qText").textContent=L(q.q);
 $("qOpts").innerHTML=q.o.map((o,j)=>`<button class="opt" data-j="${j}">(${"ABCD"[j]}) ${esc(L(o))}</button>`).join("");
 $("qFb").hidden=true;$("qNext").textContent=i===Q.length-1?tr("qAgain"):tr("qNext");$("qScore").textContent=qs+" "+tr("correctN");
 if(has3D&&mode==="quiz"){if(q.show){hlGlow=true;setHL(q.show);tagPart=null;$("tag").hidden=true;focusPart(q.show[0])}else{setHL([]);goView("quiz")}}
 if(!keep)speak(L(q.q));
 post();
}
$("qOpts").addEventListener("click",e=>{
 const b=e.target.closest(".opt");if(!b||qDone)return;qDone=true;
 const q=Q[qi],j=+b.dataset.j,btns=[...document.querySelectorAll("#qOpts .opt")];
 btns[q.a].classList.add("right");if(j!==q.a)b.classList.add("wrong");else qs++;
 $("qScore").textContent=qs+" "+tr("correctN");
 const fb=$("qFb");fb.hidden=false;fb.className="fb "+(j===q.a?"ok":"no");
 const msg=(j===q.a?tr("right")+" ":tr("wrong")+" "+tr("rightAns")+": "+L(q.o[q.a])+". ")+L(q.e);
 fb.textContent=msg;speak(msg);
 if(has3D){const ids=q.show||q.f||[];setHL(ids);if(ids[0]&&!q.show)focusPart(ids[0])}
 post();
});
$("qNext").onclick=()=>{if(qi===Q.length-1){qs=0;showQ(0)}else showQ(qi+1)};

/* ================= TABS / MODES ================= */
const tabs=[...document.querySelectorAll('[role=tab]')];
function showTab(id){
 tabs.forEach(t=>{const on=t.id===id;t.setAttribute("aria-selected",on);$(t.getAttribute("aria-controls")).hidden=!on});
 setMode(id.slice(2));
 try{localStorage.setItem("sm3d-tab",id)}catch(e){}
 post();
}
function setMode(m){
 const prev=mode;mode=m;
 $("startBtn").hidden=m!=="work";$("bCur").hidden=m!=="work";$("bMag").hidden=m!=="work";
 $("viewer").hidden=m==="theory";
 if(!has3D)return;
 keyUp();resetSim();
 if(prev==="insp"&&m!=="insp"){resetDefects();hlGlow=true;applyCut(true)}
 hlGlow=m!=="insp";
 G.work.visible=(m==="work");FX.visible=(m==="work");
 setLive([]);liveKey="";
 tgt.explode={};setHL([]);
 if(m==="parts"){goView("parts");if(curPart>=0)setHL([PARTS[curPart].id])}
 if(m==="work"){goView("work");renderPhase(0)}
 if(m==="dis"){goView("dis");applyDis(di)}
 if(m==="insp"){show3DInsp()}
 if(m==="test"){goView("test");setHL(TESTS[ti].parts);focusPart(TESTS[ti].parts[0])}
 if(m==="quiz"){showQ(qi,false)}
 if(m==="theory"&&hasTTS)speechSynthesis.cancel();
}
tabs.forEach(t=>t.addEventListener("click",()=>showTab(t.id)));
function planChanged(silent){
 renderChips();
 if(curPart>=0&&!PLAN&&PARTS[curPart].grp==="plan")clearPart();else if(curPart<0)clearPart();
 $("planInfo").hidden=!PLAN;applyDis(di,false);
 if(mode==="insp"&&!silent)show3DInsp();
 post();
}
$("bPlan").onclick=()=>{setPlan(!PLAN);if(PLAN&&mode==="parts")showPart("planet",true,true);else if(PLAN&&has3D&&mode!=="insp"&&mode!=="work"){}};
$("bCut").onclick=()=>{if(has3D)applyCut(!cutOn)};
$("bXray").onclick=()=>{if(has3D)applyXray(!xrayOn)};
$("bSpin").onclick=()=>{if(!has3D)return;controls.autoRotate=!controls.autoRotate;$("bSpin").setAttribute("aria-pressed",controls.autoRotate)};
$("bHome").onclick=()=>{if(mode==="insp")show3DInsp();else goView(mode)};

/* ================= LANGUAGE APPLY ================= */
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=tr(el.dataset.t)});
 document.querySelectorAll("[data-ta]").forEach(el=>{el.setAttribute("aria-label",tr(el.dataset.ta));el.title=tr(el.dataset.ta)});
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
 renderChips();if(curPart>=0)showPart(PARTS[curPart].id,false,false);else clearPart();
 renderPhases();renderPhase(sim.phase);
 applyDis(di,false);
 renderIList();{const keepAns=iRes[ii];openInsp(ii);if(keepAns&&compareGood===false){}}renderReport();
 renderTList();renderTest();
 renderTheory();
 showQ(qi,false);
 $("planInfo").hidden=!PLAN;$("bPlan").setAttribute("aria-pressed",PLAN);
 refreshToggles();updateTag();voiceNote();post();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;try{localStorage.setItem("sm3d-lang",LANG)}catch(e){}if(hasTTS)speechSynthesis.cancel();applyLang()}));

/* ================= INIT ================= */
if(!has3D)$("vmsg").hidden=false;
if(has3D){try{init3D()}catch(err){console.error(err);$("vmsg").hidden=false}}
$("voiceBtn").setAttribute("aria-pressed",voiceOn);
newJob(true);
renderTList();openTest(0,false);
applyLang();
let start="t-work";const h=(location.hash||"").slice(1);const hm={work:"t-work",parts:"t-parts",dis:"t-dis",insp:"t-insp",test:"t-test",theory:"t-theory",quiz:"t-quiz"};
if(hm[h])start=hm[h];else{try{const s=localStorage.getItem("sm3d-tab");if(s&&$(s))start=s}catch(e){}}
showTab(start);

})();
</script>
